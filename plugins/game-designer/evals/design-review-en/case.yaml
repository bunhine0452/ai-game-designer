schema_version: "1.1"
name: design-review-en
description: "English prompt should trigger the design-review skill and be answered in English."
tags: [trigger, en, design-review]
execution:
  prompt: "Can you review my mobile game's monetization? Daily login streaks reset if you miss a day, energy refills cost gems, and the rare characters drop at 0.5% with no pity."
  max_turns: 8
  timeout_seconds: 300
  allowed_tools: [Skill, Read, Glob, Grep]
runs: 1
graders:
  - type: tool_used
    name: skill-fired
    tool: Skill
    input_match: "design-review"
    min: 1
  - type: llm
    name: answer-language
    criteria: "The final response is written in English (code, file names and English terms in parentheses are allowed)."
  - type: llm
    name: useful-answer
    criteria: "The response addresses the request with concrete, actionable game-design content (specific mechanics, numbers, steps or fixes), not generic advice."
