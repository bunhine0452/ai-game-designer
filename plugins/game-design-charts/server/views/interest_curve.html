<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interest curve</title>
<style>
  :root { --bg:#ffffff; --ink:#1d2433; --ink2:#5b6475; --grid:#e7eaf0; --line:#3366ff; --fill:rgba(51,102,255,.12); --warn:#c2410c; --ok:#15803d; --chip:#f3f5f9; }
  :root[data-theme="dark"] { --bg:#1b1e24; --ink:#eef1f6; --ink2:#a3abba; --grid:#2c313b; --line:#7aa2ff; --fill:rgba(122,162,255,.16); --warn:#fb923c; --ok:#4ade80; --chip:#252a33; }
  * { box-sizing:border-box; }
  body { margin:0; padding:14px 16px 16px; background:var(--bg); color:var(--ink); font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif; }
  h1 { margin:0 0 2px; font-size:16px; } .sub { color:var(--ink2); font-size:12.5px; }
  svg { width:100%; height:auto; display:block; margin:10px 0 6px; touch-action:none; }
  .pt { cursor:ns-resize; } .pt:hover circle { r:7; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:8px 0; }
  .chip { padding:3px 9px; border-radius:999px; background:var(--chip); font-size:12.5px; }
  button { font:inherit; font-size:13px; padding:6px 12px; border-radius:8px; border:1px solid var(--grid); background:var(--chip); color:var(--ink); cursor:pointer; }
  ul { margin:6px 0 0; padding-left:0; list-style:none; } li { padding:6px 10px; border-radius:8px; margin:4px 0; background:var(--chip); }
  li b { color:var(--warn); font-size:12px; letter-spacing:.04em; margin-right:6px; } li.ok b { color:var(--ok); }
  textarea { width:100%; height:110px; margin-top:8px; font:12px ui-monospace,monospace; background:var(--chip); color:var(--ink); border:1px solid var(--grid); border-radius:8px; display:none; }
</style>
</head>
<body>
<h1 id="title">Interest curve</h1>
<div class="sub">Drag a point up or down to try a change. The diagnosis updates as you drag.</div>
<svg id="chart" viewBox="0 0 640 280" role="img" aria-label="Interest curve chart"></svg>
<div class="row" id="stats"></div>
<ul id="issues"></ul>
<div class="row"><button id="reset">Reset</button><button id="csv">Show CSV</button><button id="send">Send edited curve to chat</button></div>
<textarea id="csvOut" readonly></textarea>
<script>
"use strict";
// ---- diagnosis (same rules as server.py diagnose_curve) ----
function diagnose(beats) {
  const pts = beats.map((b) => ({ t: +b.t, intensity: Math.max(0, Math.min(10, +b.intensity)), label: b.label || "" })).sort((a, b) => a.t - b.t);
  const t0 = pts[0].t, t1 = pts[pts.length - 1].t, span = (t1 - t0) || 1, ys = pts.map((p) => p.intensity);
  let peakI = 0; ys.forEach((y, i) => { if (y > ys[peakI]) peakI = i; });
  const issues = [], pct = (x) => `${Math.round(x * 100)}%`, g = (x) => String(+x.toFixed(6));
  const hook = pts.find((p) => p.intensity >= 6), hookAt = hook ? (hook.t - t0) / span : null;
  if (!hook || hookAt > 0.15) issues.push({ kind: "LATE_HOOK", text: !hook ? "No strong beat (6+) in the first 15% of the session." : `First strong beat arrives at ${pct(hookAt)} of the session; aim for the first 10–15%.` });
  const peakPos = (pts[peakI].t - t0) / span;
  if (peakPos < 0.6) issues.push({ kind: "EARLY_PEAK", text: `The highest point is at ${pct(peakPos)}; later beats can't top it, so the end may feel flat.` });
  let runStart = null, longest = [0, null, null];
  for (const p of pts) { if (p.intensity <= 3) { if (runStart === null) runStart = p.t; if (p.t - runStart > longest[0]) longest = [p.t - runStart, runStart, p.t]; } else runStart = null; }
  if (longest[0] / span > 0.2) issues.push({ kind: "LONG_LULL", text: `Intensity stays at 3 or below from ${g(longest[1])} to ${g(longest[2])} (${pct(longest[0] / span)} of the session).` });
  let flatStart = 0, flat = [0, null, null];
  for (let i = 1; i < pts.length; i++) { if (Math.abs(ys[i] - ys[i - 1]) >= 1) flatStart = i; const d = pts[i].t - pts[flatStart].t; if (d > flat[0]) flat = [d, pts[flatStart].t, pts[i].t]; }
  if (flat[0] / span > 0.25) issues.push({ kind: "FLAT_STRETCH", text: `Almost no change from ${g(flat[1])} to ${g(flat[2])} (${pct(flat[0] / span)} of the session). Add a spike or a rest.` });
  let peaks = 0; for (let i = 1; i < ys.length - 1; i++) if (ys[i] > ys[i - 1] && ys[i] >= ys[i + 1]) peaks++;
  if (pts.length >= 6 && peaks < 2) issues.push({ kind: "NO_RHYTHM", text: "Fewer than 2 peaks: tension needs release-and-rise cycles (a sawtooth)." });
  if (peakI === pts.length - 1 && pts.length >= 5) issues.push({ kind: "NO_RESOLUTION", text: "The session ends on its peak with no wind-down. Add a short release beat after the climax." });
  const mean = ys.reduce((a, b) => a + b, 0) / ys.length, sd = Math.sqrt(ys.reduce((a, y) => a + (y - mean) ** 2, 0) / ys.length);
  if (sd < 1.2) issues.push({ kind: "MONOTONE", text: `Intensity barely varies (standard deviation ${sd.toFixed(1)}). Contrast drives interest.` });
  return { beats: pts, duration: span, peak: { t: pts[peakI].t, intensity: ys[peakI], position: peakPos }, hook_position: hookAt, peaks, mean: Math.round(mean * 100) / 100, sd: Math.round(sd * 100) / 100, issues };
}
// ---- rendering ----
let original = null, beats = null, title = "";
const W = 640, H = 280, PL = 36, PR = 12, PT = 14, PB = 34, $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
function render() {
  const d = diagnose(beats), pts = d.beats, t0 = pts[0].t, span = d.duration;
  const X = (t) => PL + (t - t0) / span * (W - PL - PR), Y = (v) => PT + (1 - v / 10) * (H - PT - PB);
  let s = "";
  for (let v = 0; v <= 10; v += 2) s += `<line x1="${PL}" x2="${W - PR}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--grid)"/><text x="${PL - 8}" y="${Y(v) + 4}" font-size="10" text-anchor="end" fill="var(--ink2)">${v}</text>`;
  const path = pts.map((p, i) => `${i ? "L" : "M"}${X(p.t).toFixed(1)} ${Y(p.intensity).toFixed(1)}`).join("");
  s += `<path d="${path}L${X(pts[pts.length - 1].t)} ${Y(0)}L${X(t0)} ${Y(0)}Z" fill="var(--fill)"/><path d="${path}" fill="none" stroke="var(--line)" stroke-width="2.5" stroke-linejoin="round"/>`;
  pts.forEach((p, i) => { s += `<g class="pt" data-i="${i}"><circle cx="${X(p.t)}" cy="${Y(p.intensity)}" r="5.5" fill="var(--bg)" stroke="var(--line)" stroke-width="2.5"/><title>${esc(p.label || "beat")} · t=${p.t} · ${p.intensity.toFixed(1)}</title></g>`;
    if (p.label && (i % Math.ceil(pts.length / 8) === 0 || i === pts.length - 1)) s += `<text x="${X(p.t)}" y="${H - 8}" font-size="10" text-anchor="middle" fill="var(--ink2)">${esc(p.label.slice(0, 14))}</text>`; });
  s += `<circle cx="${X(d.peak.t)}" cy="${Y(d.peak.intensity)}" r="9" fill="none" stroke="var(--warn)" stroke-dasharray="3 3"/>`;
  $("chart").innerHTML = s;
  $("title").textContent = title ? `Interest curve: ${title}` : "Interest curve";
  $("stats").innerHTML = [`${pts.length} beats`, `peak ${d.peak.intensity.toFixed(1)} at ${Math.round(d.peak.position * 100)}%`, `${d.peaks} local peaks`, `mean ${d.mean}`, `sd ${d.sd}`].map((x) => `<span class="chip">${x}</span>`).join("");
  $("issues").innerHTML = d.issues.length ? d.issues.map((x) => `<li><b>${x.kind}</b>${esc(x.text)}</li>`).join("") : `<li class="ok"><b>OK</b>No structural issues found. Check it against real playtest data.</li>`;
  $("csvOut").value = "time,intensity,label\n" + pts.map((p) => `${p.t},${p.intensity.toFixed(1)},${(p.label || "").replace(/,/g, ";")}`).join("\n");
  document.body.dataset.rendered = d.issues.map((x) => x.kind).join(",") || "OK";
  sizeChanged();
}
function show(sc) { if (!sc || !sc.beats) return; original = JSON.parse(JSON.stringify(sc.beats)); beats = JSON.parse(JSON.stringify(sc.beats)); title = sc.title || ""; render(); }
// dragging
let drag = -1;
$("chart").addEventListener("pointerdown", (e) => { const g = e.target.closest(".pt"); if (!g) return; drag = +g.dataset.i; $("chart").setPointerCapture(e.pointerId); });
$("chart").addEventListener("pointermove", (e) => { if (drag < 0) return; const r = $("chart").getBoundingClientRect(), y = (e.clientY - r.top) / r.height * H;
  const sorted = diagnose(beats).beats; const target = sorted[drag]; const v = Math.max(0, Math.min(10, (1 - (y - PT) / (H - PT - PB)) * 10));
  const k = beats.findIndex((b) => +b.t === target.t && (b.label || "") === target.label); if (k >= 0) { beats[k].intensity = Math.round(v * 2) / 2; render(); } });
$("chart").addEventListener("pointerup", () => (drag = -1));
$("reset").onclick = () => { if (original) { beats = JSON.parse(JSON.stringify(original)); render(); } };
$("csv").onclick = () => { const t = $("csvOut"); t.style.display = t.style.display === "block" ? "none" : "block"; sizeChanged(); };
$("send").onclick = () => request("ui/message", { role: "user", content: { type: "text", text: `Here is my edited interest curve${title ? " for " + title : ""}. Re-check it and suggest the beats that would fix any remaining issues:\n\n${$("csvOut").value}` } }).catch(() => {});
// ---- MCP Apps host protocol (JSON-RPC over postMessage) ----
let nextId = 1; const pending = new Map();
const send = (m) => window.parent.postMessage(m, "*");
function request(method, params) { return new Promise((resolve, reject) => { const id = nextId++; pending.set(id, { resolve, reject }); send({ jsonrpc: "2.0", id, method, params }); }); }
const notify = (method, params) => send(params === undefined ? { jsonrpc: "2.0", method } : { jsonrpc: "2.0", method, params });
function sizeChanged() { notify("ui/notifications/size-changed", { width: document.documentElement.scrollWidth, height: document.documentElement.scrollHeight }); }
function theme(ctx) { if (ctx && ctx.theme) document.documentElement.dataset.theme = ctx.theme; }
window.addEventListener("message", (ev) => {
  if (ev.source !== window.parent) return; const m = ev.data; if (!m || m.jsonrpc !== "2.0") return;
  if (m.id !== undefined && m.method === undefined) { const p = pending.get(m.id); if (p) { pending.delete(m.id); "error" in m ? p.reject(m.error) : p.resolve(m.result); } return; }
  if (m.method === "ui/notifications/tool-result") show(m.params && m.params.structuredContent);
  else if (m.method === "ui/notifications/host-context-changed") theme(m.params);
  else if (m.method === "ui/resource-teardown" && m.id !== undefined) send({ jsonrpc: "2.0", id: m.id, result: {} });
});
(async () => {
  if (window.parent === window) { // opened directly: show a demo curve
    show({ title: "demo", beats: [{ t: 0, intensity: 2, label: "spawn" }, { t: 3, intensity: 3 }, { t: 8, intensity: 3 }, { t: 12, intensity: 7, label: "ambush" }, { t: 16, intensity: 4 }, { t: 22, intensity: 8, label: "boss" }, { t: 25, intensity: 3, label: "exit" }] });
    return;
  }
  try { const r = await request("ui/initialize", { appInfo: { name: "Interest curve", version: "1.0.0" }, appCapabilities: {}, protocolVersion: "2026-01-26" }); theme(r && r.hostContext); } catch (e) { /* host without MCP Apps */ }
  notify("ui/notifications/initialized"); sizeChanged();
})();
</script>
</body>
</html>
