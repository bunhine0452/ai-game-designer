schema_version: "1.1"
name: balance-economy-ko
description: "Korean prompt should trigger the balance-economy skill and be answered in Korean."
tags: [trigger, ko, balance-economy]
execution:
  prompt: "가챠 확률이 0.6%이고 90회 천장이 있으면 평균 몇 번 뽑아야 하는지 계산해 주고, 확률 공개 관련해서 주의할 점도 알려줘."
  max_turns: 8
  timeout_seconds: 300
  allowed_tools: [Skill, Read, Glob, Grep]
runs: 1
graders:
  - type: tool_used
    name: skill-fired
    tool: Skill
    input_match: "balance-economy"
    min: 1
  - type: llm
    name: answer-language
    criteria: "The final response is written in Korean (code, file names and English terms in parentheses are allowed)."
  - type: llm
    name: useful-answer
    criteria: "The response addresses the request with concrete, actionable game-design content (specific mechanics, numbers, steps or fixes), not generic advice."
  - type: llm
    name: localized-terms
    criteria: "The response uses Korean terminology for game-design concepts, and at least one technical term is shown on first use with its English equivalent in parentheses, for example a localized term followed by (Core Loop), (Interest Curve), (Pity), (Sink), (Silhouette) or (Dark Pattern)."
