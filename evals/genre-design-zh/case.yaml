schema_version: "1.1"
name: genre-design-zh
description: "Simplified Chinese prompt should trigger the genre-design skill and be answered in Simplified Chinese."
tags: [trigger, zh, genre-design]
execution:
  prompt: "我想做一个塔防加放置类的融合游戏，这两个品类该怎么结合？"
  max_turns: 8
  timeout_seconds: 300
  allowed_tools: [Skill, Read, Glob, Grep]
runs: 1
graders:
  - type: tool_used
    name: skill-fired
    tool: Skill
    input_match: "genre-design"
    min: 1
  - type: llm
    name: answer-language
    criteria: "The final response is written in Simplified Chinese (code, file names and English terms in parentheses are allowed)."
  - type: llm
    name: useful-answer
    criteria: "The response addresses the request with concrete, actionable game-design content (specific mechanics, numbers, steps or fixes), not generic advice."
  - type: llm
    name: localized-terms
    criteria: "The response uses Simplified Chinese terminology for game-design concepts, and at least one technical term is shown on first use with its English equivalent in parentheses, for example a localized term followed by (Core Loop), (Interest Curve), (Pity), (Sink), (Silhouette) or (Dark Pattern)."
