schema_version: "1.1"
name: playable-prototype-ja
description: "Japanese prompt should trigger the playable-prototype skill and be answered in Japanese."
tags: [trigger, ja, playable-prototype]
execution:
  prompt: "デッキ構築ローグライクのカードリスト（24枚、CSV）とランの興味曲線があります。これをブラウザで遊べるプロトタイプにしたいです。最初に作る範囲、数値の扱い、設計どおりか確かめるテストとボットの方針を教えてください。"
  max_turns: 8
  timeout_seconds: 300
  allowed_tools: [Skill, Read, Glob, Grep]
runs: 1
graders:
  - type: tool_used
    name: skill-fired
    tool: Skill
    input_match: "playable-prototype"
    min: 1
  - type: llm
    name: answer-language
    criteria: "The final response is written in Japanese (code, file names and English terms in parentheses are allowed)."
  - type: llm
    name: useful-answer
    criteria: "The response addresses the request with concrete, actionable game-design content (specific mechanics, numbers, steps or fixes), not generic advice."
  - type: llm
    name: localized-terms
    criteria: "The response uses Japanese terminology for game-design concepts, and at least one technical term is shown on first use with its English equivalent in parentheses, for example a localized term followed by (Prototype), (Greybox), (Self-test), (Core Loop) or (Pillar)."
