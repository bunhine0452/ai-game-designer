  room = scratch(["####################", "#@s................#", ...Array(7).fill("####################"), "####################"]);
  S = act(newState(room), room, "Ps").S; r = act(S, room, "R"); ok("a sunflower blocks its tile", r.S.x === 1 && r.ev.some((e) => e.e === "bump"));
  ok("integer scaling: 1280×720 → ×4, 1920×1080 → ×6, never below ×1", scaleFor(1280, 720) === 4 && scaleFor(1920, 1080) === 6 && scaleFor(300, 100) === 1);
  const base = new Set(Object.values(PAL)); ok("base palette stays within 32 colours (27 + reserved)", base.size <= 32, `${base.size} colours`);
  const pass = out.every((o) => o.pass), el = document.getElementById("selftest");
  el.textContent = JSON.stringify({ game: "dot-gardener", pass, results: out }, null, 1); el.hidden = false; document.title = "SELFTEST " + (pass ? "PASS" : "FAIL");
}
// ?shot=1: the broken fountain blooming (vine bridge + mushroom, the colour wave spreading); 2: the dark heart; title; end
function setShot(k) {
  if (k === "title") { G.scene = "title"; G.t = 1; return; }
  if (k === "end") { enterRoom(5); G.scene = "end"; G.endT = 3; G.stats = { undos: 4, resets: 1, falls: 2, room0: 70, room1: 95, room2: 120, room3: 88, room4: 160, room5: 151 }; return; }
  const room = k === "2" ? 5 : 3; enterRoom(room); G.scene = "play";
  const seq = room === 5 ? "R U Ps D R Pv L U X R R D R R R R R U Ps L U Pm".split(" ") : "R R R R Pv R R Pm".split(" ");
  for (const a of seq) { const r = act(G.S, G.room, a); if (r) G.S = r.S; }
  syncVis(); G.hero = { x: G.S.x, y: G.S.y, z: 0, pose: "stand" }; G.roomT = 10; G.t = 3.3;
  if (room === 3) { for (const a of ["R", "U", "R", "R"]) { const r = act(G.S, G.room, a); if (r) G.S = r.S; } G.hero = { x: G.S.x, y: G.S.y, z: 0, pose: "happy" }; G.bloomT = 0.42; G.leaving = 1; }
}

// ---- main ----
fit(); enterRoom(0, false);
if (AUTO && !SHOT && !TEST) startGame(0);   // ?autoplay=1 is a watch mode: the solver plays every room
if (TEST) selftest();
if (SHOT) { document.body.classList.add("shot"); setShot(params.get("shot")); }
let last = performance.now();
(function frame(now) {
  const dt = Math.max(0, Math.min(0.05, (now - last) / 1000)); last = now;   // rAF stamps can precede the script's clock
  if (!SHOT) update(dt); else G.t += 0;
  G.shake = Math.max(0, G.shake - dt);
  if (G.scene === "play" || G.scene === "title") music(G.scene === "title" ? "bloom" : G.bloomT >= 0 ? "bloom" : G.room.R.dark ? "dark" : "decay");
  render(); present(); requestAnimationFrame(frame);
})(last);
</script>
