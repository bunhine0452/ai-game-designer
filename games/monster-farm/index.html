<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>

    --disp:"Jua","Nunito",system-ui,sans-serif; --sans:"Gowun Dodum","Nunito",system-ui,-apple-system,sans-serif; }

  .pill { display:flex; align-items:center; gap:8px; height:46px; padding:0 16px 0 8px; border-radius:23px; background:var(--cream); box-shadow:0 3px 0 rgba(61,44,30,.25); font:22px var(--disp); }

  .ib { height:46px; min-width:46px; padding:0 14px; border:0; border-radius:16px; background:var(--cream); color:var(--ink); font:18px var(--disp); cursor:pointer; box-shadow:0 3px 0 rgba(61,44,30,.25); display:grid; place-items:center; }
  .ib:active { transform:translateY(2px); box-shadow:0 1px 0 rgba(61,44,30,.25); } .ib svg { width:22px; height:22px; } .ib.on { background:#ffe7a8; } .ib.off { color:#b8a48f; }

  .ib.sleep.ready { animation:ready 1.4s ease-in-out infinite; } @keyframes ready { 50% { box-shadow:0 3px 0 #3d4590,0 0 0 6px rgba(127,139,216,.45); } }

  .mon.locked { opacity:.55; cursor:default; } .mon.locked img { filter:brightness(0) opacity(.3); }
  #combo { margin-top:6px; padding:9px 11px; border-radius:14px; background:#f6efff; font:700 12.5px/1.4 var(--sans); color:#6a4c93; }

  #bar { left:50%; bottom:14px; transform:translateX(-50%); display:flex; gap:8px; padding:9px; border-radius:24px; background:rgba(122,79,44,.92); box-shadow:0 5px 0 rgba(61,44,30,.35); }
  .tool { position:relative; width:84px; height:84px; border:0; border-radius:18px; background:#f3dfbd; cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; font:14px var(--disp); color:var(--ink); box-shadow:inset 0 -4px 0 rgba(0,0,0,.12); }
  .tool svg { width:44px; height:44px; } .tool kbd { position:absolute; left:6px; top:4px; font:800 11px Nunito; opacity:.5; }
  .tool.on { background:#fff8ec; box-shadow:0 0 0 4px var(--gold),inset 0 -4px 0 rgba(0,0,0,.08); transform:translateY(-4px); }
  .tool small { font:700 11px var(--sans); color:var(--ink2); }

  #hint { position:absolute; z-index:6; pointer-events:none; padding:5px 11px; border-radius:12px; background:rgba(61,44,30,.88); color:#fff; font:700 13px var(--sans); white-space:nowrap; display:none; transform:translate(-50%,-100%); }
  .float { position:absolute; z-index:6; transform:translate(-50%,-50%); font:22px var(--disp); color:#fff; -webkit-text-stroke:4px var(--ink); paint-order:stroke fill; pointer-events:none; animation:float 1.1s ease-out forwards; white-space:nowrap; }
  @keyframes float { 0% { opacity:0; transform:translate(-50%,-20%) scale(.6); } 15% { opacity:1; transform:translate(-50%,-60%) scale(1.15); } 100% { opacity:0; transform:translate(-50%,-180%); } }
  #fade { position:absolute; inset:0; z-index:7; background:#1c2140; opacity:0; pointer-events:none; transition:opacity .7s; display:grid; place-items:center; color:#fff; font:40px var(--disp); }
  #fade.on { opacity:1; pointer-events:auto; }

  #modal, #screen { position:absolute; inset:0; display:none; align-items:center; justify-content:center; z-index:8; background:rgba(40,30,20,.45); }
  #screen { background:linear-gradient(rgba(255,250,235,.0),rgba(60,40,20,.35)); }

  .letter { position:relative; width:min(640px,90%); padding:30px 34px 26px; border-radius:22px; background:var(--paper); box-shadow:0 8px 0 rgba(61,44,30,.25),0 30px 60px rgba(0,0,0,.25); border:3px solid #ecd4a8; text-align:center; animation:pop .35s cubic-bezier(.2,.9,.3,1.3); }

  .lines li i { font-style:normal; font-size:22px; width:30px; text-align:center; flex:none; }
  .btn { display:inline-block; text-decoration:none; padding:12px 26px; border-radius:16px; border:0; cursor:pointer; font:20px var(--disp); color:#fff; background:linear-gradient(#7cc95a,#5aa04a); box-shadow:0 4px 0 #3d7a2f; margin:12px 4px 0; }
  .btn:active { transform:translateY(2px); box-shadow:0 2px 0 #3d7a2f; } .btn.alt { background:#efe0c2; color:var(--ink); box-shadow:0 4px 0 #cdb58a; }
  .feed { display:flex; gap:10px; justify-content:center; margin-top:12px; }

  .feed button:hover { border-color:var(--gold); transform:translateY(-2px); } .feed button span { display:block; font-size:34px; }
  .mole { width:150px; height:150px; margin:-10px auto 0; display:block; animation:peek 2.2s ease-in-out infinite; } @keyframes peek { 50% { transform:translateY(6px) rotate(-3deg); } }
  .msg { min-height:24px; margin-top:10px; font:700 15px var(--sans); color:#8a5a2c; }
  .total { margin-top:10px; font:30px var(--disp); color:#c9831a; }
  .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:16px 0 6px; } .stat { padding:12px 6px; border-radius:16px; background:#fff8ec; } .stat b { display:block; font:32px var(--disp); } .stat span { font:700 12px var(--sans); color:var(--ink2); }
  .q { margin-top:10px; padding:12px 14px; border-radius:14px; background:#eef6e8; font:700 14px var(--sans); color:#3d6a2f; }
  .title-wrap { text-align:center; margin-top:-40px; }

  .title-wrap .en { font:900 20px Nunito; letter-spacing:.3em; color:#fff; text-shadow:0 2px 6px rgba(61,44,30,.6); margin-top:4px; }
  .title-wrap .tag { display:inline-block; margin:18px 0 6px; padding:9px 20px; border-radius:18px; background:rgba(255,248,236,.95); font:700 18px var(--sans); }
  .foot { position:absolute; left:0; right:0; bottom:16px; text-align:center; font:700 12.5px var(--sans); color:#fff; text-shadow:0 1px 4px rgba(40,30,20,.7); } .foot a { color:#ffe7a8; }
  .how { display:grid; grid-template-columns:1fr 1fr; gap:10px; text-align:left; margin-top:10px; } .how div { padding:12px 14px; border-radius:14px; background:#fff8ec; font:700 14px/1.45 var(--sans); color:var(--ink2); } .how b { display:block; font:18px var(--disp); color:var(--ink); }
  #coach { position:absolute; z-index:7; width:280px; padding:12px 15px; border-radius:16px; background:var(--cream); border:3px solid var(--gold); box-shadow:0 5px 0 rgba(61,44,30,.25); font:700 14px/1.45 var(--sans); display:none; }
  #coach.show { display:block; animation:fade .3s; } #coach b { color:var(--leaf); } #coach .s { font:800 10.5px Nunito; letter-spacing:.2em; color:#c9831a; }
  #coach button { margin-top:8px; border:0; border-radius:10px; padding:5px 11px; font:16px var(--disp); background:#efe0c2; cursor:pointer; color:var(--ink); }
  #rotate { position:fixed; left:12px; right:12px; top:12px; z-index:20; padding:12px 14px; border-radius:12px; background:var(--cream); font:700 14px var(--sans); display:none; } #rotate.show { display:block; } #rotate button { float:right; background:none; border:0; font-size:18px; cursor:pointer; }
  .shot #modal.show, .shot #screen.show, .shot .letter { animation:none; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv"></canvas>
  <div class="hud pill" id="clock"><canvas id="dial" width="116" height="116"></canvas><div><b id="dayTxt"></b><small id="timeTxt"></small></div></div>

<script>

        report: "밤사이 변화", ok: "좋아요", ship: "저녁 출하", total: "합계", empty: "출하할 작물이 없어요", wild: "숲 가장자리의 손님", wildName: "굴파기 두더지",

        end: "3일 체험 끝!", endBody: "몬스터와 함께한 사흘이었어요.", stEarn: "번 골드", stMut: "반짝 순무", stFriends: "친구 몬스터",
        q: "그레이박스 검증 질문: 2일차에 몬스터 배치를 바꿔 보셨나요?", again: "처음부터", arcade: "게임 목록으로",
        hTill: "괭이질", hSeed: "씨앗 심기 −20G", hWater: "물 주기", hHarvest: "수확하기", hMove: "{m} 옮기기", hGrow: "자라는 중 ({s}/4)", hNeedGold: "골드가 부족해요", hPick: "먼저 오른쪽에서 몬스터를 고르세요",
        tagline: "몬스터가 땅을 바꾸는 3일간의 힐링 농장", start: "농장으로", how: "놀이 방법",
        howTitle: "몬스터 팜 놀이 방법", h1: "밭 가꾸기", h1t: "괭이로 갈고, 씨앗을 심고, 물을 주세요. 물을 준 날마다 한 단계씩 자랍니다.", h2: "실패는 없어요", h2t: "물을 깜빡해도 시들지 않아요. 성장만 잠시 멈춥니다.",
        h3: "몬스터 배치", h3t: "몬스터마다 주변 3×3에 효과를 줍니다. 범위를 겹치면 반짝 순무가 생겨요.", h4: "하루의 흐름", h4t: "정오엔 손님이, 저녁엔 출하가 있어요. 잠자기로 다음 날로 넘어갑니다. 창이 열려 있으면 시간이 멈춰요.",
        coach1: "<b>괭이 → 씨앗 → 물뿌리개</b> 순서로 밭을 가꿔 보세요. 칸에 마우스를 올리면 할 일이 보여요.", coach2: "<b>몬스터를 옮겨</b> 범위를 겹쳐 보세요. 모슬링과 반딧몽이 겹치면 반짝 순무가 자라요.", coach3: "할 일을 마쳤으면 <b>잠자기</b>. 밤사이 몬스터들이 일을 해 둡니다.", next: "다음", skip: "그만 보기",
        night: "밤이 깊어 갑니다…", glimmer: "반짝 순무", shipLine: (n, name, g) => `${name} × ${n} = ${g}G` },
  en: { day: "Day", gold: "gold", turnip: "turnip", carrot: "carrot", berry: "wild berry",
        tools: { till: "Hoe", seed: "Seeds", water: "Water", harvest: "Harvest", move: "Place" }, toolSub: { till: "till soil", seed: "20G", water: "water crops", harvest: "when ripe", move: "monsters" },
        phases: { morning: "Morning · look around for what changed overnight", noon: "Noon · someone is at the forest edge", afternoon: "Afternoon · try monster combinations", evening: "Evening · shipping payout", night: "Night · time for bed" },
        pause: "Pause", resume: "Resume", sleep: "Sleep", roster: "Monsters", rosterSub: "click → place on field",
        comboTxt: "Where Mossling's and Glowbug's areas overlap, glimmer turnips grow, worth 3×.",
        report: "Overnight changes", ok: "Nice", ship: "Evening shipping", total: "Total", empty: "Nothing to ship today", wild: "A visitor at the forest edge", wildName: "Burrowmole",
        feed: "What will you offer?", later: "Later",
        wildClue: (c) => `A bit of ${c} lay next to the footprints.`, joined: "The mole joins the farm! It keeps its whole row watered now.", sniff: "Sniff… not this one. Try something else? (There's no failing.)",
        end: "That's the 3-day demo!", endBody: "Three days on the farm with your monsters.", stEarn: "Gold earned", stMut: "Glimmer turnips", stFriends: "Monster friends",
        q: "Greybox question: did you rearrange your monsters on day 2?", again: "Play again", arcade: "Back to the arcade",
        hTill: "Till", hSeed: "Plant −20G", hWater: "Water", hHarvest: "Harvest", hMove: "Move {m}", hGrow: "Growing ({s}/4)", hNeedGold: "Not enough gold", hPick: "Pick a monster on the right first",
        tagline: "A cozy 3-day farm where monsters change the land", start: "To the farm", how: "How to play",
        howTitle: "How to play Monster Farm", h1: "Farm", h1t: "Till, plant and water. Crops grow one stage on each watered day.", h2: "No failure", h2t: "Forget to water and nothing wilts. Growth just pauses.",
        h3: "Place monsters", h3t: "Each monster affects its 3×3. Overlap the right ones for glimmer turnips.", h4: "The day", h4t: "A visitor at noon, shipping in the evening, then sleep. Time stops while a panel is open.",
        coach1: "Use <b>Hoe → Seeds → Water</b>. Hover a tile to see what you'll do.", coach2: "<b>Move monsters</b> so their areas overlap. Mossling + Glowbug grows glimmer turnips.", coach3: "When you're done, <b>Sleep</b>. Your monsters work overnight.", next: "Next", skip: "Skip tips",
        night: "The night deepens…", glimmer: "glimmer turnip", shipLine: (n, name, g) => `${name} × ${n} = ${g}G` },
};
let lang = "ko"; const T = () => TXT[lang];

const N = 6, DAY_START = 6, DAY_END = 20, REAL_SECONDS_PER_DAY = 210;
const MONSTERS = {
  moss: { ko: "모슬링", en: "Mossling", job: { ko: "주변 3×3에 아침 이슬(물 주기)", en: "waters its 3×3 every morning" }, color: "#74c69d" },
  paw:  { ko: "포포", en: "Pawpaw", job: { ko: "주변 3×3을 밤사이 갈아 줌", en: "tills its 3×3 overnight" }, color: "#e9a23b" },
  glow: { ko: "반딧몽", en: "Glowbug", job: { ko: "주변 3×3 작물 +1 성장 (밤)", en: "+1 growth to its 3×3 at night" }, color: "#ffd166" },
  mole: { ko: "굴파기 두더지", en: "Burrowmole", job: { ko: "자기 줄 전체에 물길 (항상 촉촉)", en: "keeps its whole row watered" }, color: "#a98467" },
};
const PRICE = { turnip: 60, glimmer: 180 };   // glimmer = mutated turnip (Mossling + Glowbug overlap)
let fxOn = true, EV = [];
const emit = (e) => { if (fxOn) EV.push(e); };
const fresh = () => ({ day: 1, hour: DAY_START, gold: 100, tiles: Array.from({ length: N * N }, () => ({ till: false, crop: 0, wet: false, mut: false })),
  mons: { moss: { x: 1, y: 1 }, paw: { x: 4, y: 1 }, glow: null, mole: null }, bin: [], found: 0, earned: 0, friends: 3, wildDone: false, wildShown: false,
  clue: "berry", tool: "till", pick: null, paused: false, speed: 1, modal: null, shipped: false, report: [] });
let S = fresh();
const tile = (x, y) => (x >= 0 && y >= 0 && x < N && y < N ? S.tiles[y * N + x] : null);
const inArea = (m, x, y) => m && Math.abs(m.x - x) <= 1 && Math.abs(m.y - y) <= 1;
function act(x, y) {
  const t = tile(x, y); if (!t || S.modal) return false;
  if (S.tool === "move") { if (!S.pick) return false; S.mons[S.pick] = { x, y }; emit({ t: "move", x, y, k: S.pick }); return true; }
  if (S.tool === "till" && !t.till) { t.till = true; emit({ t: "till", x, y }); return true; }

  $("go").onclick = () => { audioInit(); sfx.ui(); startGame(); };
  $("how").onclick = () => { audioInit(); howTo(); };
}
function startGame() { S = fresh(); UI.screen = "play"; UI.shownModal = null; hideScreen(); coachStart(); }
function howTo() {
  const t = T(), m = $("modal"); UI.shownModal = "how";
  m.innerHTML = `<div class="letter"><div class="k">${t.how}</div><h2>${t.howTitle}</h2><div class="how"><div><b>${t.h1}</b>${t.h1t}</div><div><b>${t.h2}</b>${t.h2t}</div><div><b>${t.h3}</b>${t.h3t}</div><div><b>${t.h4}</b>${t.h4t}</div></div><button class="btn" id="hOk">${t.ok}</button></div>`;
  m.classList.add("show"); const wasPaused = S.paused; S.paused = true; $("hOk").onclick = () => { m.classList.remove("show"); m.innerHTML = ""; UI.shownModal = null; S.paused = wasPaused; };
}
async function sleep() {
  if (S.modal || UI.fading || UI.screen !== "play") return; audioInit(); coachDone();
  UI.fading = true; const f = $("fade"); f.textContent = T().night; f.classList.add("on"); sfx.sleep();
  await new Promise((r) => setTimeout(r, document.body.classList.contains("shot") ? 0 : 1300));
  nextDay(); f.classList.remove("on"); UI.fading = false;
}

// ---- coach ----------------------------------------------------------------------------------------------------
const COACH = [{ x: 470, y: 470, k: "coach1" }, { x: 690, y: 120, k: "coach2" }, { x: 690, y: 80, k: "coach3" }];
function coachStart() { if (SET.coach) { UI.coach = 0; coachShow(); } }
function coachShow() { const c = $("coach"), s = COACH[UI.coach]; if (!s) return coachDone(); c.style.left = `${s.x}px`; c.style.top = `${s.y}px`;
  c.innerHTML = `<div class="s">TIP ${UI.coach + 1} / 3</div>${T()[s.k]}<br><button id="cOk">${UI.coach === 2 ? T().ok : T().next}</button> <button id="cSkip">${T().skip}</button>`; c.classList.add("show");
  $("cOk").onclick = () => { UI.coach++; coachShow(); }; $("cSkip").onclick = coachDone; }
function coachAdvance(to) { if (UI.coach >= 0 && UI.coach < to) { UI.coach = to; coachShow(); } }
function coachDone() { UI.coach = -1; $("coach").classList.remove("show"); SET.coach = false; saveSet(); }

// ---- input -------------------------------------------------------------------------------------------------------
function stagePt(ev) { const r = $("stage").getBoundingClientRect(); return { x: (ev.clientX - r.left) / K, y: (ev.clientY - r.top) / K }; }
cv.addEventListener("mousemove", (ev) => {
  const p = stagePt(ev), x = Math.floor((p.x - OX) / CELL), y = Math.floor((p.y - OY) / CELL), hint = $("hint");
  UI.hover = tile(x, y) ? { x, y } : null;
  const txt = UI.hover && UI.screen === "play" && !S.modal ? hintFor(x, y) : "";
  if (txt) { hint.textContent = txt; hint.style.display = "block"; hint.style.left = `${OX + x * CELL + CELL / 2}px`; hint.style.top = `${OY + y * CELL - 2}px`; } else hint.style.display = "none";
});
cv.addEventListener("mouseleave", () => { UI.hover = null; $("hint").style.display = "none"; });
cv.addEventListener("click", (ev) => {
  if (UI.screen !== "play") return; audioInit();
  const p = stagePt(ev), x = Math.floor((p.x - OX) / CELL), y = Math.floor((p.y - OY) / CELL);
  if (Math.hypot(p.x - BIN.x, p.y - BIN.y) < 50 && S.hour >= 18 && !S.shipped) { S.modal = "ship"; return; }
  const mk = Object.keys(S.mons).find((k) => S.mons[k] && S.mons[k].x === x && S.mons[k].y === y);
  if (mk && S.tool !== "move") { S.pick = mk; S.tool = "move"; UI.hop[mk] = performance.now(); sfx.hop(); return; }
  if (act(x, y)) { if (S.tool === "water" || S.tool === "seed") coachAdvance(1); } else if (tile(x, y)) sfx.nope();
});
$("bar").onclick = (ev) => { const b = ev.target.closest("[data-tool]"); if (b) { audioInit(); S.tool = b.dataset.tool; if (S.tool !== "move") S.pick = null; sfx.ui(); } };
$("roster").onclick = (ev) => { const b = ev.target.closest("[data-mon]"); if (!b || !S.mons[b.dataset.mon]) return; audioInit(); S.pick = b.dataset.mon; S.tool = "move"; UI.hop[S.pick] = performance.now(); sfx.hop(); };
$("bPause").onclick = () => { S.paused = !S.paused; sfx.ui(); };
$("bSpeed").onclick = () => { S.speed = S.speed === 1 ? 2 : S.speed === 2 ? 4 : 1; sfx.ui(); };
$("bSleep").onclick = sleep;
$("bLang").onclick = () => { lang = lang === "ko" ? "en" : "ko"; UI.shownModal = null; if (UI.screen === "title") titleScreen(); else if (UI.coach >= 0) coachShow(); };
$("bSound").onclick = () => { SET.sound = !SET.sound; saveSet(); audioInit(); if (AU.out) AU.out.gain.value = SET.sound ? 0.5 : 0; };
$("bHelp").onclick = howTo;
$("rotX").onclick = () => { UI.rotX = true; $("rotate").classList.remove("show"); };
addEventListener("keydown", (ev) => {
  if (UI.screen !== "play") return; const k = ev.key.toLowerCase();
  if (S.modal && (k === "enter" || k === "escape")) { const ok = $("mOk"); if (ok) ok.click(); return; }
  if (k >= "1" && k <= "5") { S.tool = ["till", "seed", "water", "harvest", "move"][+k - 1]; if (S.tool !== "move") S.pick = null; }
  else if (k === " ") { ev.preventDefault(); S.paused = !S.paused; } else if (k === "z") sleep();
});
addEventListener("resize", fit);

// =====================================================================================
// SELF-TEST (?test=1) and screenshot states (?shot=1, ?shot=report|title|wild)
// =====================================================================================
function selftest() {
  const out = [], ok = (name, cond, info = "") => out.push({ name, pass: !!cond, info });
  fxOn = false;
  S = fresh(); S.tool = "till"; act(3, 3); S.tool = "seed"; act(3, 3); ok("till then seed (20G)", tile(3, 3).crop === 1 && S.gold === 80);
  S.tool = "water"; act(3, 3); overnight(); ok("watered crop grows one stage", tile(3, 3).crop === 2);
  overnight(); ok("unwatered crop pauses and never wilts", tile(3, 3).crop === 2);
  S = fresh(); S.mons.glow = { x: 3, y: 3 }; tile(3, 3).till = true; tile(3, 3).crop = 1; overnight(); ok("Glowbug adds growth even without water", tile(3, 3).crop === 2);
  S = fresh(); S.mons.moss = { x: 2, y: 2 }; S.mons.glow = { x: 3, y: 3 }; tile(2, 2).till = true; tile(2, 2).crop = 1; tile(5, 5).till = true; tile(5, 5).crop = 1; overnight();
  ok("mutation only where Mossling and Glowbug areas overlap", tile(2, 2).mut && !tile(5, 5).mut);
  S = fresh(); S.mons.paw = { x: 1, y: 1 }; overnight(); ok("Pawpaw tills its 3×3 overnight", [0, 1, 2].every((y) => [0, 1, 2].every((x) => tile(x, y).till)));
  S = fresh(); ok("wrong food: no failure, the mole waits", feed("carrot") === "sniff" && !S.wildDone);
  ok("right food from the clue always works (no randomness)", feed(S.clue) === "joined" && S.wildDone && S.mons.mole);
  S.tiles[3 * N + 4].crop = 2; morningDew(); ok("mole channel waters its whole row", tile(4, 3).wet);
  S = fresh(); S.bin = ["turnip", "glimmer"]; ok("shipping pays 60 + 180", ship().total === 240 && S.gold === 340);
  S = fresh(); S.modal = "report"; const h = S.hour; advance(30); ok("time stops while a panel is open", S.hour === h);
  S = fresh(); advance(REAL_SECONDS_PER_DAY * 0.45); ok("noon brings the wild monster panel", S.modal === "wild");
  let err = "";
  try { S = fresh(); for (let d = 0; d < 3; d++) { S.modal = null;
      for (let i = 0; i < N * N; i++) { const x = i % N, y = Math.floor(i / N); S.tool = "till"; act(x, y); S.tool = "seed"; act(x, y); S.tool = "water"; act(x, y); S.tool = "harvest"; act(x, y); }
      for (let k = 0; k < 400 && S.hour < DAY_END; k++) { advance(2); if (S.modal === "wild") { feed(S.clue); S.modal = null; } if (S.modal === "ship") S.modal = null; }
      nextDay(); }
  } catch (e) { err = String(e); }
  ok("3-day bot reaches the end without errors", !err && S.modal === "end", err || `earned ${S.earned}G, mutations ${S.found}`);
  const missing = Object.keys(TXT.ko).filter((k) => !(k in TXT.en)); ok("Korean and English texts cover the same keys", !missing.length, missing.join(", "));
  try { fxOn = true; S = fresh(); UI.screen = "play"; draw(0.016); hud(); ok("farm scene and HUD render", $("bar").querySelectorAll(".tool").length === 5 && $("roster").querySelectorAll(".mon").length === 4); }
  catch (e) { ok("farm scene and HUD render", false, String(e).slice(0, 200)); }
  const pass = out.every((o) => o.pass);
  $("selftest").textContent = JSON.stringify({ game: "monster-farm", pass, results: out }, null, 1);
  $("selftest").hidden = false; document.title = `SELFTEST ${pass ? "PASS" : "FAIL"}`;
  fxOn = true; EV.length = 0; S = fresh();
}
function setupShot(kind) {
  document.body.classList.add("shot"); SET.coach = false; SET.sound = false;
  if (kind === "title") return titleScreen();
  UI.screen = "play"; hideScreen();
  S = fresh(); S.day = 2; S.hour = 9.2; S.mons.glow = { x: 2, y: 4 }; S.mons.moss = { x: 2, y: 3 }; S.friends = 4; S.gold = 140;
  for (let y = 1; y < 6; y++) for (let x = 0; x < 6; x++) { const tl = tile(x, y); tl.till = true; tl.crop = 1 + ((x * 7 + y * 3) % 4); tl.wet = (x + y) % 3 === 0; }
  [[1, 3], [2, 4], [3, 3]].forEach(([x, y]) => { tile(x, y).mut = true; tile(x, y).crop = 4; }); S.found = 3; S.bin = ["turnip", "turnip", "glimmer"]; S.pick = "glow"; S.tool = "move";
  S.report = [["🌱", lang === "ko" ? "작물 17칸이 자랐어요." : "17 crop tiles grew."], ["✨", lang === "ko" ? "모슬링과 반딧몽의 범위가 겹친 곳에 반짝 순무 싹 3개! (값 3배)" : "3 glimmer sprouts where Mossling and Glowbug overlap! (3× value)"], ["👣", lang === "ko" ? "숲 쪽으로 이어진 작은 발자국. 발자국 옆에 산딸기 조각이 떨어져 있었어요." : "Small footprints lead to the forest. A bit of wild berry lay next to the footprints."]];
  if (kind === "report") S.modal = "report";
  if (kind === "wild") { S.hour = 12; S.modal = "wild"; }
  if (kind === "dusk") S.hour = 18.9;
}
const params = new URLSearchParams(location.search);
if (params.has("lang") && TXT[params.get("lang")]) lang = params.get("lang");
fit();
if (params.has("test")) selftest();
if (params.get("shot")) setupShot(params.get("shot")); else titleScreen();
requestAnimationFrame(frame);
</script>
