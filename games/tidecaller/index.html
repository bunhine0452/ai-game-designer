<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tidecaller</title>
<meta name="description" content="A roguelike deckbuilder where every card moves the tide. Original prototype designed with ai-game-designer.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --night:#030914; --ink:#eef6f8; --ink2:#9fbccb; --ink3:#5f7f92; --line:rgba(159,188,203,.2);
    --surge:#3fe0cf; --ebb:#8f7dff; --gold:#ffcf6b; --hp:#ff6b6b; --block:#8fd3ff; --moon:#f4ecd8;
    --serif:"Fraunces",Georgia,serif; --sans:"Outfit",system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; overflow:hidden; background:linear-gradient(#030914 0 50%,#030e1a 50% 100%); color:var(--ink); font:15px/1.4 var(--sans); -webkit-user-select:none; user-select:none; }
  #stage { position:absolute; left:0; top:0; width:1280px; height:720px; transform-origin:0 0; overflow:hidden; background:#071a2b; }
  #world { position:absolute; inset:0; }
  canvas.layer { position:absolute; left:0; top:0; width:1280px; height:720px; pointer-events:none; }
  #back { z-index:0; } #units { position:absolute; inset:0; z-index:2; } #front { z-index:3; }
  #hud { position:absolute; inset:0; z-index:5; pointer-events:none; transition:opacity .4s; }
  #hud.hidden { opacity:0; } #hud.hidden * { pointer-events:none !important; }
  #fx { position:absolute; inset:0; z-index:6; pointer-events:none; }

  /* ---- top bar ---- */
  .top { position:absolute; left:0; right:0; top:0; height:66px; display:flex; align-items:center; justify-content:space-between; padding:0 22px; background:linear-gradient(rgba(3,9,20,.8),rgba(3,9,20,0)); }
  .brand { font:800 23px var(--serif); letter-spacing:.01em; pointer-events:auto; }
  .brand small { font:600 11px var(--sans); color:var(--ink2); letter-spacing:.22em; text-transform:uppercase; margin-left:10px; }
  #route { display:flex; align-items:center; pointer-events:auto; }
  #route .n { width:30px; height:30px; border-radius:50%; display:grid; place-items:center; background:rgba(8,28,44,.92); border:1.5px solid rgba(159,188,203,.3); color:var(--ink3); }
  #route .n svg { width:16px; height:16px; }
  #route .n.done { border-color:rgba(63,224,207,.55); color:var(--surge); background:rgba(14,59,68,.9); }
  #route .n.cur { border-color:var(--gold); color:var(--gold); box-shadow:0 0 0 4px rgba(255,207,107,.16); }
  #route .l { width:22px; height:2px; background:rgba(159,188,203,.22); }
  #route .lab { margin-left:12px; font:600 13px var(--sans); color:var(--ink); letter-spacing:.04em; }
  .icons { display:flex; gap:8px; pointer-events:auto; }
  .ib { position:relative; height:38px; min-width:38px; padding:0 9px; border-radius:11px; border:1px solid var(--line); background:rgba(8,28,44,.85); color:var(--ink); display:flex; gap:6px; align-items:center; justify-content:center; cursor:pointer; font:600 13px var(--sans); }
  .ib:hover { border-color:rgba(159,188,203,.55); } .ib svg { width:18px; height:18px; } .ib.mute { color:var(--ink3); }

  /* ---- fight HUD ---- */
  #fightHud > * { pointer-events:auto; }
  #energy { position:absolute; left:40px; top:522px; width:96px; height:96px; border-radius:50%; display:grid; place-items:center; font:800 36px/1 var(--serif); color:#2a1a02;
    background:radial-gradient(circle at 36% 30%,#fff6d2,#ffcf6b 38%,#c8851c 76%,#7a4a0c); box-shadow:0 0 0 3px #061019,0 0 30px rgba(255,207,107,.45); transition:filter .3s; }
  #energy small { font:700 15px var(--sans); opacity:.75; }
  #energy.empty { filter:grayscale(.75) brightness(.55); box-shadow:0 0 0 3px #061019; }
  #energy::after { content:"ENERGY"; position:absolute; bottom:-19px; font:700 10px var(--sans); letter-spacing:.24em; color:var(--ink2); }
  .pile { position:absolute; width:62px; height:86px; cursor:pointer; }
  .pile .back { position:absolute; inset:0; border-radius:9px; background:linear-gradient(150deg,#14435a,#08192a); border:2px solid #2d7383; box-shadow:3px 3px 0 #0a2433,6px 6px 0 #061520; }
  .pile .back::after { content:""; position:absolute; inset:9px; border-radius:50%; border:1.5px solid rgba(127,247,234,.35); }
  .pile .cnt { position:absolute; right:-10px; top:-10px; min-width:28px; height:28px; padding:0 6px; border-radius:14px; background:#061019; border:1.5px solid rgba(159,188,203,.5); display:grid; place-items:center; font:700 13px var(--sans); }
  #drawPile { left:150px; top:620px; } #discPile { left:1192px; top:640px; }
  #discPile .back { background:linear-gradient(150deg,#2a2660,#0b0d24); border-color:#5a4fc0; }
  #endTurn { position:absolute; left:1070px; top:548px; width:184px; height:56px; border-radius:28px; border:2px solid #061019; color:#2a1a02; font:700 19px var(--sans); cursor:pointer;
    background:linear-gradient(#ffe7a8,#ffcf6b 45%,#d99a2b); box-shadow:0 6px 0 #8a5a12,0 10px 24px rgba(0,0,0,.45); }
  #endTurn:active { transform:translateY(3px); box-shadow:0 3px 0 #8a5a12; }
  #endTurn:disabled { filter:grayscale(.85) brightness(.55); cursor:default; transform:none; }
  #endTurn.ready { animation:ready 1.4s ease-in-out infinite; }
  #endTurn kbd { font:700 11px var(--sans); opacity:.55; margin-left:6px; border:1px solid rgba(42,26,2,.4); border-radius:4px; padding:0 4px; }
  @keyframes ready { 50% { box-shadow:0 6px 0 #8a5a12,0 0 36px rgba(255,207,107,.9); } }
  #turnInfo { position:absolute; left:1070px; top:614px; width:184px; text-align:center; font:600 12px var(--sans); color:var(--ink2); letter-spacing:.14em; text-transform:uppercase; }

  /* ---- cards ---- */
  #hand { position:absolute; left:0; top:0; width:0; height:0; }
  .card { position:absolute; left:0; top:0; width:150px; height:210px; border-radius:14px; padding:32px 9px 10px; display:flex; flex-direction:column; align-items:center; color:var(--ink);
    border:2.5px solid transparent; cursor:pointer; transition:transform .28s cubic-bezier(.2,.8,.2,1),opacity .3s,filter .2s,box-shadow .2s; box-shadow:0 12px 26px rgba(0,0,0,.5); pointer-events:auto; }
  .card.surge { background:linear-gradient(170deg,#14495b,#0a2534 58%,#071a26) padding-box,linear-gradient(160deg,#9ffcf2,#159e9a) border-box; }
  .card.ebb { background:linear-gradient(170deg,#2c2866,#151839 58%,#0b0d24) padding-box,linear-gradient(160deg,#d6cfff,#4b3fb8) border-box; }
  .card.either { background:linear-gradient(170deg,#1d3d5f,#121f3b 58%,#0a1428) padding-box,linear-gradient(135deg,#9ffcf2,#8f7dff) border-box; }
  .card .cost { position:absolute; left:-9px; top:-9px; width:38px; height:38px; border-radius:50%; display:grid; place-items:center; font:800 20px var(--serif); color:#2a1a02;
    background:radial-gradient(circle at 36% 30%,#fff6d2,#ffcf6b 45%,#c8851c); border:2.5px solid #061019; }
  .card .nm { position:absolute; top:9px; left:28px; right:8px; text-align:center; font:700 14.5px/1.1 var(--serif); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .card .art { width:130px; height:76px; border-radius:8px; overflow:hidden; border:1px solid rgba(255,255,255,.16); position:relative; flex:none; background:#061019; }
  .card .art svg { display:block; width:100%; height:100%; }
  .card .badge { position:absolute; right:5px; bottom:5px; padding:1px 7px; border-radius:9px; font:800 13px var(--sans); background:rgba(3,10,18,.82); border:1px solid rgba(255,255,255,.22); }
  .card.surge .badge { color:#7ff7ea; } .card.ebb .badge { color:#c3b8ff; } .card.either .badge { color:#fff; }
  .card .ty { margin:7px 0 2px; font:700 10px var(--sans); letter-spacing:.2em; text-transform:uppercase; }
  .card.surge .ty { color:var(--surge); } .card.ebb .ty { color:#b3a8ff; } .card.either .ty { color:#d5e7ec; }
  .card .tx { flex:1; display:flex; align-items:center; justify-content:center; text-align:center; font:500 13px/1.32 var(--sans); color:#dcebf0; padding:0 1px; }
  .card .tx b { color:#fff; } .card .tx .kd { color:#ffb4a8; } .card .tx .kb { color:#a8dcff; } .card .tx .kw { color:var(--gold); font-weight:700; }
  .card .rar { width:8px; height:8px; transform:rotate(45deg); border:1.5px solid #061019; flex:none; }
  .rar.Basic { background:#6d8594; } .rar.Common { background:#dfe8ec; } .rar.Uncommon { background:#3fe0cf; } .rar.Rare { background:#ffcf6b; box-shadow:0 0 8px #ffcf6b; }
  .card.off { filter:saturate(.4) brightness(.7); }
  .card.off .cost { background:radial-gradient(circle at 36% 30%,#ffd6d6,#ff8a8a 45%,#a33a3a); }
  .card.sel { box-shadow:0 0 0 3px var(--gold),0 0 34px rgba(255,207,107,.6),0 12px 26px rgba(0,0,0,.5); }
  .card.flying { transition:transform .3s cubic-bezier(.55,0,.7,1),opacity .22s .1s; pointer-events:none; }
  .card.nope { animation:nope .35s; }
  @keyframes nope { 25% { margin-left:-8px; } 50% { margin-left:8px; } 75% { margin-left:-4px; } }

  /* ---- units ---- */
  .unit { position:absolute; width:0; height:0; }
  .sprite { position:absolute; left:0; transform:translateX(-50%); pointer-events:none; transition:filter .2s; }
  .sprite .body { width:100%; height:100%; transform-origin:50% 100%; }
  .sprite svg { display:block; width:100%; height:100%; overflow:visible; }
  .hitbox { position:absolute; left:0; transform:translateX(-50%); }
  .unit.targetable .hitbox { cursor:crosshair; }
  .unit.targetable .sprite { filter:drop-shadow(0 0 7px rgba(255,207,107,.55)); }
  .unit.aim .sprite { filter:drop-shadow(0 0 16px rgba(255,207,107,1)); }
  .unit.guard .sprite { filter:drop-shadow(0 0 12px rgba(143,211,255,.85)); }
  .plate { position:absolute; left:0; top:12px; transform:translateX(-50%); width:160px; text-align:center; pointer-events:none; }
  .plate .nm { font:700 11.5px var(--sans); letter-spacing:.14em; text-transform:uppercase; color:#cfe3ea; margin-bottom:4px; text-shadow:0 1px 3px #000,0 0 8px #000; white-space:nowrap; }
  .bar { position:relative; height:17px; border-radius:9px; background:#24101a; border:2px solid #061019; }
  .bar i { position:absolute; left:0; top:0; bottom:0; border-radius:7px; }
  .bar .ghost { background:#ffe0d8; animation:ghost .9s ease-in-out infinite; }
  .bar .fill { background:linear-gradient(#ff9182,#d93f3f); transition:width .4s cubic-bezier(.2,.8,.2,1); }
  @keyframes ghost { 50% { opacity:.45; } }
  .bar.shielded { border-color:#8fd3ff; box-shadow:0 0 12px rgba(143,211,255,.6); }
  .bar .num { position:absolute; inset:0; display:grid; place-items:center; font:800 11.5px var(--sans); color:#fff; text-shadow:0 1px 2px #000; }
  .bar .shield { position:absolute; left:-20px; top:50%; transform:translateY(-50%); width:30px; height:32px; display:none; place-items:center; font:800 13px var(--sans); color:#04202c;
    background:linear-gradient(#d9f1ff,#8fd3ff); clip-path:path("M15 0 L30 6 V15 C30 24 23 30 15 32 C7 30 0 24 0 15 V6 Z"); }
  .bar.shielded .shield { display:grid; }
  .bar .pv { position:absolute; right:-4px; top:-25px; font:800 16px var(--sans); color:#ffb4a8; text-shadow:0 1px 3px #000; display:none; }
  .bar .pv.on { display:block; } .bar .pv.lethal { color:var(--gold); } .bar .pv.blk { color:var(--block); left:-4px; right:auto; }
  .chips { display:flex; gap:4px; justify-content:center; margin-top:5px; flex-wrap:wrap; }
  .chip { font:700 11px var(--sans); padding:2px 8px; border-radius:9px; background:rgba(3,10,18,.85); border:1px solid rgba(255,255,255,.18); pointer-events:auto; }
  .chip.drench { color:var(--block); } .chip.ecl { color:#ff8fa8; border-color:rgba(255,90,122,.55); } .chip.stag { color:var(--gold); }
  .intent { position:absolute; left:0; transform:translateX(-50%); display:flex; gap:5px; pointer-events:auto; animation:ibob 2.6s ease-in-out infinite; }
  @keyframes ibob { 50% { margin-bottom:4px; } }
  .it { display:flex; align-items:center; gap:4px; padding:4px 10px 4px 8px; border-radius:999px; background:rgba(3,10,18,.88); border:1.5px solid rgba(255,255,255,.2); font:800 16px var(--sans); white-space:nowrap; box-shadow:0 4px 12px rgba(0,0,0,.4); }
  .it svg { width:17px; height:17px; }
  .it.atk { color:#ffa391; border-color:rgba(255,120,100,.6); } .it.blk { color:var(--block); border-color:rgba(143,211,255,.55); }
  .it.up { color:#7ff7ea; border-color:rgba(63,224,207,.6); } .it.dn { color:#c3b8ff; border-color:rgba(143,125,255,.6); }
  .it.ecl { color:#ff8fa8; border-color:rgba(255,90,122,.6); } .it.stun { color:var(--gold); }

  /* idle and reaction animations */
  @keyframes bob { 50% { transform:translateY(-4px); } }
  @keyframes hover { 50% { transform:translateY(-14px); } }
  @keyframes breathe { 50% { transform:scale(1.012,1.018); } }
  @keyframes sway { 50% { transform:rotate(-1.6deg); } }
  .k-player .body { animation:breathe 3.6s ease-in-out infinite; }
  .k-crab .body { animation:bob 2.3s ease-in-out infinite; }
  .k-gull .body { animation:hover 2.1s ease-in-out infinite; }
  .k-sentinel .body { animation:bob 4.2s ease-in-out infinite; }
  .k-moon .body { animation:sway 6s ease-in-out infinite; transform-origin:30% 100%; }
  svg .wl { transform-origin:64px 54px; animation:flap .42s ease-in-out infinite alternate; }
  svg .wr { transform-origin:90px 54px; animation:flapR .42s ease-in-out infinite alternate; }
  @keyframes flap { to { transform:rotate(16deg) scaleY(.78); } } @keyframes flapR { to { transform:rotate(-12deg) scaleY(.8); } }
  svg .glowp { animation:glowp 2.4s ease-in-out infinite; } @keyframes glowp { 50% { opacity:.55; } }
  svg .claw { transform-origin:138px 50px; animation:snap 2.6s ease-in-out infinite; } @keyframes snap { 0%,72%,100% { transform:none; } 82% { transform:rotate(-14deg); } }
  svg .jaw { transform-origin:186px 122px; animation:jaw 3.2s ease-in-out infinite; } @keyframes jaw { 50% { transform:rotate(7deg); } }
  svg .cloak { transform-origin:75px 30px; animation:cloak 4s ease-in-out infinite; } @keyframes cloak { 50% { transform:skewX(-1.5deg); } }
  svg .halo { opacity:0; transition:opacity .8s; } .unit.eclipsed svg .halo { opacity:1; }
  .body.hit { animation:hit .42s ease-out; }
  @keyframes hit { 0% { filter:brightness(2.8) saturate(0); } 25% { transform:translateX(12px); } 55% { transform:translateX(-7px); filter:none; } 100% { transform:none; } }
  .body.lunge { animation:lunge .5s ease-in-out; } @keyframes lunge { 40% { transform:translateX(-50px) scale(1.06); } 100% { transform:none; } }
  .body.cast { animation:cast .45s ease-out; } @keyframes cast { 35% { transform:translateX(12px) rotate(2.5deg); } }
  .body.phit { animation:phit .45s; } @keyframes phit { 0% { filter:brightness(2.5) sepia(1) hue-rotate(-40deg); } 30% { transform:translateX(-14px); } 100% { transform:none; } }
  .unit.dead .sprite { animation:sink 1.1s ease-in forwards; } @keyframes sink { to { transform:translate(-50%,80px); opacity:0; filter:blur(3px); } }
  .unit.dead .plate, .unit.dead .intent { opacity:0; transition:opacity .4s; }
  .unit.enter .sprite { animation:rise .9s cubic-bezier(.2,.8,.2,1) both; } @keyframes rise { from { transform:translate(-50%,100px); opacity:0; } }

  /* ---- floating text, banner, arrow ---- */
  .float { position:absolute; transform:translate(-50%,-50%); font:800 34px var(--serif); color:#fff; white-space:nowrap; text-shadow:0 3px 0 #061019,0 0 14px rgba(0,0,0,.7); animation:float 1.05s ease-out forwards; }
  .float.dmg { color:#ffa391; } .float.blk { color:var(--block); font-size:26px; } .float.small { font:800 14px var(--sans); }
  .float.info { font:800 15px var(--sans); color:var(--gold); letter-spacing:.06em; text-transform:uppercase; }
  @keyframes float { 0% { opacity:0; transform:translate(-50%,-20%) scale(.55); } 14% { opacity:1; transform:translate(-50%,-62%) scale(1.18); } 24% { transform:translate(-50%,-70%) scale(1); } 100% { opacity:0; transform:translate(-50%,-175%); } }
  #banner { position:absolute; left:0; right:0; top:178px; text-align:center; opacity:0; }
  #banner.show { animation:banner var(--dur,1.4s) ease-out forwards; }
  #banner::before { content:""; position:absolute; left:50%; top:50%; width:820px; height:150px; transform:translate(-50%,-50%); background:radial-gradient(closest-side,rgba(3,10,18,.75),transparent); z-index:-1; }
  #banner h2 { margin:0; font:800 66px/1 var(--serif); letter-spacing:.03em; background:linear-gradient(#ffffff 30%,#8ff9ee); -webkit-background-clip:text; background-clip:text; color:transparent; filter:drop-shadow(0 4px 14px rgba(0,0,0,.6)); }
  #banner.ebb h2 { background-image:linear-gradient(#ffffff 30%,#c9c0ff); } #banner.red h2 { background-image:linear-gradient(#ffffff 20%,#ff9aae); }
  #banner.small h2 { font-size:40px; } #banner p { margin:10px 0 0; font:600 16px var(--sans); letter-spacing:.08em; text-shadow:0 1px 4px #000; }
  @keyframes banner { 0% { opacity:0; transform:scale(.86); } 12% { opacity:1; transform:scale(1.03); } 20% { transform:scale(1); } 76% { opacity:1; } 100% { opacity:0; } }
  #arrow { position:absolute; left:0; top:0; width:1280px; height:720px; display:none; }
  #arrow path { animation:dash .6s linear infinite; } @keyframes dash { to { stroke-dashoffset:-28; } }
  #choice { position:absolute; z-index:7; display:none; gap:8px; transform:translateX(-50%); }
  #choice.show { display:flex; }
  #choice button { font:700 14px var(--sans); padding:10px 15px; border-radius:999px; border:2px solid #061019; cursor:pointer; box-shadow:0 4px 0 rgba(0,0,0,.35); }
  #choice .cs { background:linear-gradient(#b9fff8,#3fe0cf); color:#03211f; } #choice .ce { background:linear-gradient(#e6e1ff,#8f7dff); color:#140f3a; }

  /* ---- screens and modals ---- */
  #screen, #modal { position:absolute; inset:0; display:none; align-items:center; justify-content:center; }
  #screen { z-index:8; background:radial-gradient(ellipse at 50% 45%,rgba(4,14,26,.55),rgba(2,6,12,.9)); }
  #screen.title { background:linear-gradient(rgba(2,6,12,.05),rgba(2,6,12,.35) 55%,rgba(2,6,12,.75)); }
  #modal { z-index:9; background:rgba(2,6,12,.84); }
  #screen.show, #modal.show { display:flex; animation:fade .35s; }
  @keyframes fade { from { opacity:0; } }
  .panel { width:min(1000px,92%); text-align:center; position:relative; }
  .kicker { font:700 12px var(--sans); letter-spacing:.34em; text-transform:uppercase; color:var(--surge); }
  .panel h2 { font:800 48px/1.05 var(--serif); margin:12px 0 10px; }
  .muted { color:var(--ink2); margin:0 auto; max-width:620px; }
  .row { display:flex; gap:14px; justify-content:center; align-items:center; }
  .btn { display:inline-block; text-decoration:none; font:700 17px var(--sans); padding:14px 30px; border-radius:999px; border:2px solid #061019; cursor:pointer; color:#2a1a02;
    background:linear-gradient(#ffe7a8,#ffcf6b 45%,#d99a2b); box-shadow:0 5px 0 #8a5a12,0 12px 26px rgba(0,0,0,.4); }
  .btn:active { transform:translateY(3px); box-shadow:0 2px 0 #8a5a12; }
  .btn.ghost { background:rgba(8,28,44,.88); color:var(--ink); border-color:rgba(159,188,203,.35); box-shadow:none; }
  .title-wrap { text-align:center; margin-top:-40px; }
  .title-wrap .kicker { color:#a7f3ea; }
  .title-wrap h1 { font:800 124px/0.92 var(--serif); margin:14px 0 0; letter-spacing:-.01em; background:linear-gradient(180deg,#ffffff 25%,#a4fbf1 62%,#3fe0cf); -webkit-background-clip:text; background-clip:text; color:transparent; filter:drop-shadow(0 8px 30px rgba(63,224,207,.28)); }
  .title-wrap .tag { font:500 21px var(--sans); color:#d8eaef; margin:18px 0 36px; text-shadow:0 2px 8px #000; }
  .foot { position:absolute; left:0; right:0; bottom:20px; text-align:center; font-size:12.5px; color:var(--ink2); text-shadow:0 1px 4px #000; }
  .foot a { color:#d8eaef; }
  .mapsvg { width:900px; height:250px; margin:16px auto 22px; display:block; overflow:visible; }
  .mn .disc { fill:#0b2436; stroke:rgba(159,188,203,.35); stroke-width:2; } .mn.done .disc { fill:#0e3b44; stroke:#3fe0cf; } .mn.cur .disc { fill:#2a2108; stroke:#ffcf6b; stroke-width:3; }
  .mn .ico { color:#7d97a6; } .mn.cur .ico { color:#ffcf6b; } .mn.done .ico { color:#3fe0cf; }
  .mn text { fill:#9fbccb; font:600 14px Outfit,sans-serif; } .mn.cur text { fill:#fff; font-weight:700; }
  .mn .pulse { fill:none; stroke:#ffcf6b; stroke-width:2; transform-box:fill-box; transform-origin:center; animation:pulse 1.6s infinite; }
  @keyframes pulse { from { transform:scale(.8); opacity:.9; } to { transform:scale(1.3); opacity:0; } }
  .picks { display:flex; gap:44px; justify-content:center; margin:34px 0 34px; height:270px; align-items:center; }
  .pickwrap { width:150px; height:210px; animation:deal .55s var(--d) both; perspective:800px; }
  .pickwrap .card { position:relative; transform:scale(1.22); }

<script>
"use strict";
// =====================================================================================
// RULES. Numbers come straight from the design (showcase/02-claude-en-deckbuilder).
// Cards: cards/tidecaller-starter-v3.csv (FINAL v3, after the cost-curve pass).
// =====================================================================================
const CSV = `Splash,1,6,0,0,0,1,0,0,Surge,Basic
Brace,1,0,0,5,0,1,0,0,Ebb,Basic
Riptide,1,6,0,0,0,1,1,0,Surge,Common
Undertow,1,4,0,0,1,1,0,0,Ebb,Common
Brine Lash,1,5,0,0,0,1,1,0,Surge,Common
Kelp Snare,1,0,0,4,0,1,1,0,Ebb,Common
Mist Veil,1,0,0,7,0,1,0,0,Ebb,Common
Ebb and Flow,1,0,0,0,2,2,0,0,Either,Common
Spindrift,1,0,4,0,0,2,0,0,Surge,Common
Rogue Wave,2,12,0,0,0,2,0,0,Surge,Uncommon
Spring Tide,1,0,0,0,1,4,0,0,Surge,Uncommon
Neap Tide,0,0,0,0,1,3,0,1,Ebb,Common
Saltspray,0,3,0,0,0,1,1,1,Surge,Common
Breakwater,2,0,0,12,0,1,0,0,Ebb,Common
Swell,2,10,0,0,0,2,0,0,Surge,Common
Whirlpool,2,0,6,0,0,1,1,0,Ebb,Uncommon
Moonpull,2,0,0,3,2,4,0,0,Surge,Uncommon
Crest Breaker,2,12,0,0,0,1,0,0,Ebb,Common
Deep Current,2,0,0,8,1,1,0,0,Ebb,Common
Still Water,2,0,0,8,0,3,0,0,Ebb,Uncommon
Tidal Wave,3,0,12,0,0,3,0,0,Surge,Rare
Maelstrom,3,18,0,0,0,1,2,1,Ebb,Rare
Abyssal Call,3,0,0,14,0,3,0,0,Ebb,Rare
Drowned Bell,2,0,8,0,0,1,1,1,Ebb,Uncommon`;
const CARDS = CSV.split("\n").map((l) => { const [name, cost, dmg, aoe, block, draw, tide, drench, exhaust, dir, rarity] = l.split(",");
  return { name, cost: +cost, dmg: +dmg, aoe: +aoe, block: +block, draw: +draw, tide: +tide, drench: +drench, exhaust: +exhaust === 1, dir, rarity }; });
const byName = Object.fromEntries(CARDS.map((c) => [c.name, c]));
const needsTarget = (c) => c.dmg > 0 || (c.drench > 0 && c.aoe === 0);

// Enemies are original; intents include what they do to the shared tide.
const ENEMIES = {
  crab:     { name: "Brine Crab", hp: 22, art: "crab", plan: [{ atk: 6 }, { block: 6, tide: +1 }, { atk: 8 }] },
  gull:     { name: "Storm Gull", hp: 12, art: "gull", plan: [{ atk: 3 }, { atk: 4, tide: -1 }] },
  sentinel: { name: "Drowned Sentinel", hp: 58, art: "sentinel", plan: [{ atk: 12 }, { atk: 8, seize: 2 }] },
  moon:     { name: "Moon-Eater", hp: 110, art: "moon", boss: true, plan: [{ atk: 10 }, { atk: 6, tide: -2 }, { block: 12, atk: 4 }] },
};
const ROUTE = [
  { kind: "fight", label: "Shoal", foes: ["crab", "crab"] },
  { kind: "fight", label: "Gull rocks", foes: ["gull", "gull", "gull"] },
  { kind: "rest", label: "Tide pool" },
  { kind: "fight", label: "Elite: Sentinel", foes: ["sentinel"] },
  { kind: "fight", label: "Boss: Moon-Eater", foes: ["moon"] },
];
const START_DECK = ["Splash", "Splash", "Splash", "Splash", "Brace", "Brace", "Brace", "Brace", "Riptide", "Undertow"];

let rng = Math.random;
function seeded(a) { return () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const shuffle = (a) => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

// Rules never touch the screen. They record events; the presentation plays them back.
let FX = [], fxOn = true;
const emit = (e) => { if (fxOn) FX.push(e); };

let G;
function newRun() {
  G = { node: 0, hp: 60, maxHp: 60, deck: START_DECK.map((n) => byName[n]), log: [], pending: null,
        stats: { crests: 0, slacks: 0, dmg: 0, turns: 0, cards: 0 } };
  startNode();
}
function log(m) { G.log.push(m); if (G.log.length > 60) G.log.shift(); }
function startNode() {
  const n = ROUTE[G.node];
  if (n.kind === "rest") { G.fight = null; G.pending = "rest"; return; }
  G.fight = { foes: n.foes.map((k, i) => ({ ...ENEMIES[k], key: k, maxHp: ENEMIES[k].hp, block: 0, drench: 0, step: i, phase: 1, eclipse: false, stagger: false, intent: null })),
              draw: shuffle(G.deck.slice()), hand: [], discard: [], exhaust: [], energy: 3, block: 0, tide: 5, turn: 0, crestThisTurn: false };
  startTurn();
}
function drawCards(n) {
  const F = G.fight, got = [];
  for (let i = 0; i < n; i++) {
    if (!F.draw.length) { if (!F.discard.length) break; F.draw = shuffle(F.discard); F.discard = []; emit({ t: "shuffle" }); }
    const c = F.draw.pop(); F.hand.push(c); got.push(c.name);
  }
  if (got.length) emit({ t: "draw", cards: got });
}
function startTurn() {
  const F = G.fight; F.turn++; G.stats.turns++; F.energy = 3; F.block = 0; F.crestThisTurn = false;
  emit({ t: "turn", n: F.turn });
  drawCards(5);
  for (const e of F.foes) if (e.hp > 0) e.intent = e.stagger ? { stunned: true } : nextIntent(e);
  for (const e of F.foes) e.stagger = false;
}
function nextIntent(e) {
  if (e.key === "moon" && e.phase === 2) return { atk: 8, swing: (G.fight.turn % 2 ? +3 : -3), eclipse: true };
  const it = e.plan[e.step % e.plan.length]; e.step++; return it;
}
const alive = () => G.fight.foes.filter((e) => e.hp > 0);

function hit(e, amount, src) {
  if (e.hp <= 0) return 0;
  const drenched = e.drench > 0;
  let dmg = amount + (drenched ? 3 : 0); if (drenched) e.drench--;
  if (e.eclipse) dmg = Math.floor(dmg / 2);
  const absorbed = Math.min(e.block, dmg); e.block -= absorbed; dmg -= absorbed; e.hp = Math.max(0, e.hp - dmg);
  G.stats.dmg += dmg;
  const i = G.fight.foes.indexOf(e);
  emit({ t: "hit", i, dmg, absorbed, drenched, eclipse: e.eclipse, hp: e.hp, block: e.block, drench: e.drench, src });
  if (e.hp <= 0) emit({ t: "kill", i });
  if (e.key === "moon" && e.phase === 1 && e.hp <= e.maxHp / 2 && e.hp > 0) { e.phase = 2; log("The Moon-Eater swallows the moon: Eclipse! Crest on its turn to break it."); emit({ t: "phase", i }); }
  return dmg;
}
function moveTide(delta) {
  const F = G.fight, from = F.tide; F.tide = Math.max(0, Math.min(10, F.tide + delta));
  emit({ t: "tide", from, to: F.tide });
  if (F.tide >= 10) { crest(); F.tide = 5; emit({ t: "tide", from: 10, to: 5, reset: true }); }
  else if (F.tide <= 0) { slack(); F.tide = 5; emit({ t: "tide", from: 0, to: 5, reset: true }); }
}
function crest() {
  const F = G.fight; F.crestThisTurn = true; G.stats.crests++; log("CREST! 8 damage to all enemies."); emit({ t: "crest" });
  for (const e of alive()) {
    if (e.key === "moon" && e.eclipse) { e.eclipse = false; e.stagger = true; log("The Crest breaks the Eclipse. The Moon-Eater staggers."); emit({ t: "break", i: F.foes.indexOf(e) }); }
    hit(e, 8, "crest");
  }
}
function slack() { const F = G.fight; F.block += 8; G.stats.slacks++; emit({ t: "slack", block: F.block }); drawCards(1); log("Slack Water: +8 block, draw 1."); }

function canPlay(c) { return !!G.fight && c.cost <= G.fight.energy; }
function play(idx, target, choice) {
  const F = G.fight, c = F.hand[idx]; if (!c || !canPlay(c)) return false;
  F.energy -= c.cost; F.hand.splice(idx, 1); G.stats.cards++;
  if (c.dmg && target) hit(target, c.dmg);
  if (c.aoe) for (const e of alive()) hit(e, c.aoe);
  if (c.drench) for (const e of (c.aoe ? alive() : target ? [target] : [])) e.drench += c.drench;
  if (c.block) { F.block += c.block; emit({ t: "block", n: c.block, total: F.block }); }
  if (c.draw) drawCards(c.draw);
  const dir = c.dir === "Either" ? (choice || "Surge") : c.dir;
  moveTide(dir === "Surge" ? c.tide : -c.tide);
  (c.exhaust ? F.exhaust : F.discard).push(c);
  log(`${c.name}${target ? " → " + target.name : ""}`);
  checkEnd(); return true;
}
// The enemy phase is split into steps so the screen can show each enemy act in turn.
function beginEnemyPhase() { const F = G.fight; F.discard.push(...F.hand); F.hand = []; }
function enemyAct(e) {
  const F = G.fight; if (e.hp <= 0) return;
  const it = e.intent || {}, i = F.foes.indexOf(e); e.block = 0;
  if (it.stunned) { log(`${e.name} is staggered.`); emit({ t: "stunned", i }); return; }
  emit({ t: "act", i });
  if (it.eclipse) { e.eclipse = true; emit({ t: "eclipse", i }); }
  if (it.block) { e.block += it.block; emit({ t: "eblock", i, n: it.block, block: e.block }); }
  if (it.atk) {
    const absorbed = Math.min(F.block, it.atk), d = it.atk - absorbed;
    F.block -= absorbed; G.hp = Math.max(0, G.hp - d); log(`${e.name} hits for ${d}.`);
    emit({ t: "phurt", dmg: d, absorbed, hp: G.hp, block: F.block });
  }
  if (it.tide) moveTide(it.tide);
  if (it.seize) { const from = F.tide; F.tide = it.seize; log(`${e.name} seizes the tide: it drops to ${it.seize}.`); emit({ t: "tide", from, to: F.tide, seize: true }); }
  if (it.swing) moveTide(it.swing);
}
function finishEnemyPhase() { if (G.hp <= 0) { G.pending = "loss"; return; } if (!checkEnd()) startTurn(); }
function endTurn() { beginEnemyPhase(); for (const e of G.fight.foes.slice()) enemyAct(e); finishEnemyPhase(); }
function checkEnd() {
  if (alive().length) return false;
  const boss = ROUTE[G.node].foes && ROUTE[G.node].foes.includes("moon");
  G.fight = null; G.pending = boss ? "win" : "reward"; emit({ t: "cleared" }); return true;
}
function rewardChoices() {
  const pool = CARDS.filter((c) => c.rarity !== "Basic"), w = { Common: 6, Uncommon: 3, Rare: 1 }, out = [];
  while (out.length < 3) { const total = pool.reduce((s, c) => s + w[c.rarity], 0); let x = rng() * total;
    for (const c of pool) { x -= w[c.rarity]; if (x <= 0) { if (!out.includes(c)) out.push(c); break; } } }
  return out;
}
function restHeal() { G.hp = Math.min(G.maxHp, G.hp + 18); }
function restRemove(name) { const i = G.deck.findIndex((c) => c.name === name); if (i >= 0) G.deck.splice(i, 1); }
function advanceNode() { G.pending = null; G.node++; startNode(); }

// Hover preview (pillar "Read the water"): play the card on a copy of the state and report the outcome.
function preview(idx, target, choice) {
  const saved = { G, rng, fxOn }, ti = target ? G.fight.foes.indexOf(target) : -1;
  G = structuredClone(G); rng = () => 0.5; fxOn = false;
  const F = G.fight, before = F.foes.map((e) => e.hp), b0 = F.block, c0 = G.stats.crests, s0 = G.stats.slacks;
  try {
    if (!play(idx, ti >= 0 ? F.foes[ti] : null, choice)) return null;
    return { foes: F.foes.map((e, i) => ({ dmg: before[i] - e.hp, hp: e.hp, block: e.block })), block: F.block - b0, blockAfter: F.block,
             tide: F.tide, crest: G.stats.crests > c0, slack: G.stats.slacks > s0 };
  } finally { G = saved.G; rng = saved.rng; fxOn = saved.fxOn; }

  F.hand = [byName["Swell"]]; F.energy = 1; ok("Cannot play above energy", !play(0, alive()[0]));
  F.hand = [byName["Ebb and Flow"]]; F.energy = 3; F.tide = 5; play(0, null, "Ebb"); ok("Either card can Ebb", F.tide === 3);
  // Moon-Eater: Eclipse halves damage; a Crest on its turn breaks it and staggers.
  G.node = 4; startNode(); F = G.fight; const m = F.foes[0]; m.hp = 50; m.phase = 2; m.eclipse = true; const before = m.hp;
  hit(m, 10); ok("Eclipse halves damage", before - m.hp === 5, `${before - m.hp}`);
  F.tide = 9; moveTide(1); ok("Crest breaks Eclipse and staggers the boss", !m.eclipse && m.stagger);
  // The hover preview must predict exactly what the play will do (pillar: read the water).
  let pvN = 0, pvOk = 0, pvBad = "";
  for (let s = 0; s < 240; s++) {
    rng = seeded(500 + s); newRun(); G.node = [0, 1, 3, 4][s % 4]; startNode(); const Fp = G.fight;
    for (const x of Fp.foes) { x.hp = 1 + Math.floor(rng() * x.maxHp); x.block = rng() < .3 ? Math.floor(rng() * 8) : 0; x.drench = rng() < .3 ? 1 : 0;
      if (x.key === "moon") { x.phase = rng() < .5 ? 2 : 1; x.eclipse = x.phase === 2 && rng() < .6; } }
    Fp.tide = 1 + Math.floor(rng() * 9); Fp.block = Math.floor(rng() * 6);
    const card = CARDS[Math.floor(rng() * CARDS.length)]; Fp.hand = [card]; Fp.energy = 3;
    const tgt = needsTarget(card) ? Fp.foes[Math.floor(rng() * Fp.foes.length)] : null, choice = rng() < .5 ? "Surge" : "Ebb";
    const p = preview(0, tgt, choice); play(0, tgt, choice); pvN++;
    const same = p && p.foes.every((f, i) => f.hp === Fp.foes[i].hp && f.block === Fp.foes[i].block) && p.tide === Fp.tide && p.blockAfter === Fp.block;
    if (same) pvOk++; else if (!pvBad) pvBad = `${card.name}: tide ${p && p.tide} vs ${Fp.tide}`;
  }
  ok("Hover preview matches the real play", pvN > 200 && pvOk === pvN, `${pvOk}/${pvN} ${pvBad}`);
  // A dead enemy must not act later in the same enemy phase.
  rng = seeded(9); newRun(); F = G.fight; F.foes[1].hp = 0; F.foes[1].intent = { atk: 50 }; F.foes[0].intent = {}; const hpB = G.hp; endTurn();
  ok("Defeated enemies skip their move", G.hp === hpB, `hp ${hpB} → ${G.hp}`);
  // Smoke test: a greedy bot plays the whole run 30 times without errors.
  let wins = 0, errors = 0;
  for (let s = 0; s < 30; s++) {
    try {
      rng = seeded(100 + s); newRun(); let guard = 0;
      while (guard++ < 600) {
        if (G.pending === "loss") break;
        if (G.pending === "win") { wins++; break; }
        if (G.pending) { G.pending = null; G.node++; startNode(); continue; }
        const Fx = G.fight; let played = true;
        while (played && G.fight) {
          played = false;
          for (let i = 0; i < Fx.hand.length; i++) if (canPlay(Fx.hand[i])) { play(i, alive()[0], Fx.tide >= 6 ? "Surge" : "Ebb"); played = true; break; }
        }
        if (G.fight) endTurn();
      }
    } catch (err) { errors++; out.push({ name: "bot error", pass: false, info: String(err && err.stack || err).slice(0, 300) }); }
  }
  ok("30 bot runs finish without errors", errors === 0, `bot wins ${wins}/30`);
  // The screen can build a fight: one unit per combatant and one card element per card in hand.
  try { rng = seeded(3); newRun(); UI.screen = "fight"; syncView(); buildUnits(false); rebuildHand(); drawUnits(); refreshHUD();
    ok("Fight screen renders units and hand", document.querySelectorAll(".unit").length === G.fight.foes.length + 1 && handEls.length === G.fight.hand.length, `${handEls.length} cards`);
  } catch (err) { ok("Fight screen renders units and hand", false, String(err).slice(0, 200)); }
  const pass = out.every((o) => o.pass);
  $("selftest").textContent = JSON.stringify({ game: "tidecaller", pass, results: out }, null, 1);
  $("selftest").hidden = false; document.title = `SELFTEST ${pass ? "PASS" : "FAIL"}`;
  fxOn = true; FX.length = 0; rng = Math.random;
}
function setupFight(node, seed) {
  rng = seeded(seed); newRun(); G.node = node; G.pending = null; startNode(); FX.length = 0;
  UI.screen = "fight"; hideScreen(); syncView(); buildUnits(false); rebuildHand(); drawUnits(); refreshHUD();
}
function setupShot(kind) {
  document.body.classList.add("shot"); SET.coach = false; SET.sound = false;
  if (kind === "title") return titleScreen();
  if (kind === "map") { rng = seeded(4); newRun(); G.node = 2; UI.mapAdvance = true; return mapScreen(); }
  if (kind === "reward") { rng = seeded(11); newRun(); setupFight(1, 11); return rewardScreen(); }
  if (kind === "rest") { rng = seeded(5); newRun(); G.node = 2; G.hp = 37; return restScreen(); }
  if (kind === "end") { rng = seeded(6); newRun(); G.node = 4; Object.assign(G.stats, { turns: 17, crests: 6, slacks: 3, dmg: 312, cards: 58 }); G.deck.push(byName["Tidal Wave"], byName["Moonpull"]); UI.eatT = 0; return endScreen(true); }
  if (kind === "gulls") { setupFight(1, 21); const F = G.fight; F.tide = 2; F.foes[0].hp = 7; F.foes[2].drench = 1; syncView(); UI.water = UI.waterTarget = 2; drawUnits(); UI.hover = 1; layoutHand(true); setPreview(1, null, "Surge"); return; }
  setupFight(4, 42); const F = G.fight; G.deck.push(byName["Rogue Wave"], byName["Moonpull"], byName["Tidal Wave"]);
  F.hand = ["Rogue Wave", "Moonpull", "Splash", "Ebb and Flow", "Brace"].map((n) => byName[n]);
  F.tide = 8; F.turn = 4; F.energy = 3; F.foes[0].hp = 61; F.foes[0].drench = 1; F.foes[0].intent = { atk: 6, tide: -2 }; G.hp = 41; F.block = 0;
  UI.water = UI.waterTarget = 8; UI.eat = UI.eatT = .3; syncView(); rebuildHand(); drawUnits(); refreshHUD();
  UI.hover = 0; layoutHand(true); setPreview(0, F.foes[0], "Surge");
}

const params = new URLSearchParams(location.search);
fit();
if (params.has("test")) selftest();
if (params.get("shot")) setupShot(params.get("shot")); else titleScreen();
requestAnimationFrame(frame);
</script>
