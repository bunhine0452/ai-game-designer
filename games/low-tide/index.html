<!doctype html>
<html lang="en">
<head>

<title>Low Tide</title>
<meta name="description" content="A short horror chapter in a flooding lighthouse. Original prototype designed with ai-game-designer.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --ink:#e7eef5; --ink2:#9fb0c0; --ink3:#5f7080; --gold:#e8c46a; --red:#ff5a5a; --line:rgba(160,180,200,.18);

  * { box-sizing:border-box; }

  #lamp svg { width:28px; height:28px; } #lamp .bar { width:150px; height:8px; border-radius:4px; background:rgba(255,255,255,.1); overflow:hidden; } #lamp .bar i { display:block; height:100%; background:linear-gradient(90deg,#c9a227,#ffe8a3); }
  #lamp small { display:block; font:500 11.5px var(--sans); color:var(--ink2); margin-top:3px; } #lamp.off svg { opacity:.45; }

  #caps div i { font-style:normal; width:22px; height:22px; border-radius:50%; border:1.5px solid rgba(255,255,255,.5); display:grid; place-items:center; font-size:13px; flex:none; }
  #caps div.danger { color:#ffb4b4; } #caps div.danger i { border-color:var(--red); color:var(--red); }

  #prompt kbd { display:inline-block; min-width:20px; padding:0 5px; margin-right:6px; border-radius:4px; background:var(--gold); color:#1a1300; font:700 12px var(--sans); text-align:center; }
  #touch { position:absolute; inset:0; z-index:6; pointer-events:none; display:none; } #touch.on { display:block; }
  #touch button { position:absolute; pointer-events:auto; width:74px; height:74px; border-radius:50%; border:1px solid rgba(255,255,255,.25); background:rgba(255,255,255,.08); color:#fff; font:700 18px var(--sans); }
  #screen, #modal { position:absolute; inset:0; display:none; align-items:center; justify-content:center; z-index:8; }
  #screen { background:radial-gradient(ellipse at 50% 40%,rgba(2,4,8,.2),rgba(1,2,4,.85)); } #modal { z-index:9; background:rgba(1,2,4,.8); }
  #screen.show, #modal.show { display:flex; animation:fade .5s; } @keyframes fade { from { opacity:0; } }
  .card { width:min(760px,90%); padding:30px 36px; border-radius:18px; background:rgba(6,12,18,.95); border:1px solid var(--line); text-align:center; box-shadow:0 30px 80px rgba(0,0,0,.6); }
  .kicker { font:600 11.5px var(--sans); letter-spacing:.3em; text-transform:uppercase; color:var(--gold); }
  .card h2 { margin:10px 0; font:700 46px/1.05 var(--serif); }
  .muted { color:var(--ink2); }
  .btn { display:inline-block; text-decoration:none; padding:13px 28px; border-radius:10px; border:1px solid var(--gold); cursor:pointer; font:600 16px var(--sans); color:#140f00; background:var(--gold); }
  .btn.alt { background:transparent; color:var(--ink); border-color:var(--line); }
  .row { display:flex; gap:12px; justify-content:center; margin-top:22px; }
  .opts { display:grid; gap:10px; text-align:left; margin:20px auto 0; max-width:440px; }

  .opts input[type=checkbox] { width:18px; height:18px; accent-color:var(--gold); } .opts input[type=range] { flex:1; accent-color:var(--gold); }
  .title-wrap { position:absolute; left:90px; top:150px; width:560px; }
  .title-wrap h1 { margin:0; font:700 116px/0.95 var(--serif); letter-spacing:.01em; color:#eef3f7; text-shadow:0 0 40px rgba(232,196,106,.25); }
  .title-wrap h1 i { color:var(--gold); }
  .title-wrap p { font:500 18px/1.55 var(--sans); color:var(--ink2); margin:18px 0 26px; max-width:470px; }
  .title-wrap .row { justify-content:flex-start; }
  .warn { margin-top:20px; font:500 12.5px var(--sans); color:var(--ink3); max-width:470px; }
  .keys { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:18px 0 6px; font:500 13.5px var(--sans); color:var(--ink2); text-align:left; }
  .keys b { display:inline-block; min-width:26px; padding:2px 6px; margin-right:6px; border-radius:5px; background:rgba(255,255,255,.1); color:var(--ink); text-align:center; font-weight:600; }
  .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:20px; } .stat { padding:14px; border-radius:12px; background:rgba(255,255,255,.04); border:1px solid var(--line); } .stat b { display:block; font:700 30px var(--serif); } .stat span { font:600 11px var(--sans); color:var(--ink3); letter-spacing:.14em; text-transform:uppercase; }
  .foot { position:absolute; left:0; right:0; bottom:18px; text-align:center; font:500 12px var(--sans); color:var(--ink3); } .foot a { color:var(--ink2); }
  #rotate { position:fixed; left:12px; right:12px; top:12px; z-index:20; padding:12px 14px; border-radius:12px; background:#0b141c; font:500 14px var(--sans); display:none; } #rotate.show { display:block; } #rotate button { float:right; background:none; border:0; color:var(--ink2); font-size:18px; cursor:pointer; }
  .shot #screen.show, .shot #modal.show, .shot #caps div { animation:none; }
</style>

<body>
<div id="stage">

  <div class="hud" id="obj"><div class="k"><svg viewBox="0 0 16 16" id="arrow"><path d="M8 1l5 10H3z" fill="currentColor"/></svg><span>Objective</span></div><div class="t" id="objT"></div><div class="w" id="where"></div></div>

    <button id="tE" style="right:40px;bottom:110px;background:rgba(232,196,106,.25)">E</button><button id="tF" style="right:130px;bottom:40px">F</button><button id="tRun" style="right:40px;bottom:20px;font-size:13px">RUN</button></div>

  </div>
</div>

<pre id="selftest" hidden></pre>

<script>
"use strict";
// =====================================================================================
// RULES. Map and beats from the design (showcase/04-codex-en-horror-lighthouse):
// rooms follow the revised beat list; every sound has a directional caption.
// =====================================================================================
const W = 40, H = 25;
const ROOMS = {
  quay:    { x: 1,  y: 17, w: 9,  h: 7, name: "Service quay" },
  gate:    { x: 1,  y: 9,  w: 9,  h: 7, name: "Gatehouse" },
  intake:  { x: 11, y: 15, w: 12, h: 9, name: "Flooded intake" },
  alcove:  { x: 24, y: 19, w: 6,  h: 5, name: "Maintenance alcove", checkpoint: true },
  gallery: { x: 11, y: 9,  w: 19, h: 5, name: "Exposed gallery" },
  chart:   { x: 31, y: 9,  w: 8,  h: 7, name: "Chart room" },
  winch:   { x: 31, y: 17, w: 8,  h: 7, name: "Winch room", checkpoint: true },
  lens:    { x: 24, y: 1,  w: 15, h: 7, name: "Lens room" },
  roof:    { x: 11, y: 1,  w: 12, h: 7, name: "Roof" },
  dock:    { x: 1,  y: 1,  w: 9,  h: 7, name: "Tether dock" },
};
const DOORS = [
  { x: 5, y: 16, a: "quay", b: "gate" }, { x: 10, y: 15, a: "gate", b: "intake" }, { x: 23, y: 21, a: "intake", b: "alcove" },
  { x: 16, y: 14, a: "intake", b: "gallery", lock: "pump" }, { x: 30, y: 11, a: "gallery", b: "chart" }, { x: 35, y: 16, a: "chart", b: "winch" },
  { x: 35, y: 8, a: "chart", b: "lens", lock: "chart" }, { x: 23, y: 4, a: "lens", b: "roof", lock: "lens" }, { x: 10, y: 4, a: "roof", b: "dock", lock: "beacon" },
];
const SPOTS = { model: [5, 11, "gate"], pump: [20, 21, "intake"], callsign: [27, 22, "alcove"], chart: [35, 12, "chart"], lens: [31, 4, "lens"], beacon: [16, 3, "roof"], boat: [3, 3, "dock"] };
const STEPS = [
  { id: "model", text: "Learn the pump bypass on the dry model in the gatehouse." },
  { id: "pump", text: "Reroute the lower pump in the intake (hold E). It is loud." },
  { id: "chart", text: "Read the chart in the chart room." },
  { id: "lens", text: "Work the lens shutter: press E as the needle crosses the gold arc (3 times)." },
  { id: "beacon", text: "Turn the beacon offshore and send the call sign." },
  { id: "boat", text: "RUN to the boat on the tether dock!" },
  { id: "done", text: "You made it out." },
];
let rng = Math.random;
function seeded(a) { return () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const roomAt = (x, y) => Object.keys(ROOMS).find((k) => { const r = ROOMS[k]; return x >= r.x && x < r.x + r.w && y >= r.y && y < r.y + r.h; });
const doorAt = (x, y) => DOORS.find((d) => d.x === x && d.y === y);
function fresh() {
  return { step: 0, flags: {}, px: 3.5, py: 20.5, lantern: false, battery: 100, running: false, toggleRun: false, checkpoint: [3.5, 20.5],
    keeper: { x: 18.5, y: 19.5, mode: "patrol", wp: 0, tx: 0, ty: 0, lost: 0, on: true, zone: "intake" }, captions: [], t: 0, hold: 0,
    lens: { a: 0, hits: 0, active: false }, surge: 0, nextSurge: 40, fade: 0, caught: 0, ended: false, intakeDrained: false, callsign: null, beam: 0, seen: { quay: true } };
}
let S = fresh();
function walkable(x, y) {
  const ix = Math.floor(x), iy = Math.floor(y), d = doorAt(ix, iy);
  if (d) return !d.lock || S.flags[d.lock];
  return !!roomAt(ix, iy);
}
function isWater(x, y) {
  const r = roomAt(Math.floor(x), Math.floor(y));
  if (r === "intake") return !S.intakeDrained || y > 20 || S.surge > 0;
  if (r === "quay") return x < 3.2 || (S.surge > 0 && x < 5);
  if (r === "dock") return x < 4.5 && y > 4.5;
  return false;
}
const PATROL = { intake: [[13, 17], [21, 17], [21, 22], [13, 22]], gallery: [[12, 11], [28, 11]], lens: [[25, 3], [37, 3], [37, 6], [25, 6]], roof: [[12, 3], [21, 5]] };

// ---- sound + captions (every audio cue has a visual caption with direction) ----------------------
let audio = null, master = null, nbuf = null, volume = 0.6;
function audioInit() {
  if (audio) { if (audio.state === "suspended") audio.resume(); return; }
  try {
    audio = new (window.AudioContext || window.webkitAudioContext)(); master = audio.createGain(); master.gain.value = volume; master.connect(audio.destination);
    const n = audio.sampleRate * 2, b = audio.createBuffer(1, n, audio.sampleRate), d = b.getChannelData(0); let l = 0; for (let i = 0; i < n; i++) { const w = Math.random() * 2 - 1; l = (l + .02 * w) / 1.02; d[i] = l * 3.5; } nbuf = b;
    // sea and wind outside the walls
    const src = audio.createBufferSource(), lp = audio.createBiquadFilter(), gn = audio.createGain(), lfo = audio.createOscillator(), lg = audio.createGain();
    src.buffer = b; src.loop = true; lp.type = "lowpass"; lp.frequency.value = 520; gn.gain.value = .12; lfo.frequency.value = .07; lg.gain.value = .08; lfo.connect(lg); lg.connect(gn.gain); src.connect(lp); lp.connect(gn); gn.connect(master); src.start(); lfo.start();
  } catch (e) { audio = null; }
}
// tone(freq, dur, type, gain, noise[, pan]): pan follows the source direction when given
function tone(freq, dur, type = "sine", gain = 0.2, noise = false, pan = 0) {
  if (!audio) return;
  const t0 = audio.currentTime, g = audio.createGain(); g.gain.setValueAtTime(gain, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  let out = g; if (audio.createStereoPanner) { const p = audio.createStereoPanner(); p.pan.value = Math.max(-1, Math.min(1, pan)); g.connect(p); out = p; } out.connect(master);
  if (noise) { const s = audio.createBufferSource(); s.buffer = nbuf; const f = audio.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = freq * 4; s.connect(f); f.connect(g); s.start(t0, Math.random()); s.stop(t0 + dur + .05); }
  else { const o = audio.createOscillator(); o.type = type; o.frequency.value = freq; o.connect(g); o.start(); o.stop(t0 + dur); }
}
const panOf = (x) => (x - S.px) / 8;
function dirOf(x, y) {
  const dx = x - S.px, dy = y - S.py;
  if (Math.hypot(dx, dy) < 1.5) return "close";
  return Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "below" : "above");
}
function caption(text, x, y) {
  const label = x === undefined ? `[${text}]` : `[${text} — ${dirOf(x, y)}]`;
  const last = S.captions[S.captions.length - 1];
  if (last && last.text === label && S.t - last.t < 1.2) return;
  S.captions.push({ text: label, t: S.t }); if (S.captions.length > 3) S.captions.shift();
}
// Noise: the keeper hears it. Returns true if the keeper was close enough to hear.
function noise(x, y, radius, label) {
  if (label) caption(label, x, y);
  const k = S.keeper; if (!k.on || k.mode === "chase") return false;
  if (Math.hypot(k.x - x, k.y - y) <= radius) { k.mode = "investigate"; k.tx = x; k.ty = y; return true; }
  return false;
}

// ---- simulation --------------------------------------------------------------------------------------
const objective = () => STEPS[S.step].id;
function tryInteract() {
  const near = (id) => { const [x, y] = SPOTS[id]; return Math.hypot(S.px - x - .5, S.py - y - .5) < 1.6; };
  if (near("callsign") && !S.callsign) { S.callsign = "MARLOW-7"; caption("You find a scrawled rescue call sign: MARLOW-7"); tone(520, .3, "triangle", .12); return "callsign"; }
  const o = objective();
  if (o === "model" && near("model")) { S.flags.model = true; S.step++; caption("Valve clicks — you learn the bypass"); tone(660, .15, "triangle", .15); return o; }
  if (o === "chart" && near("chart")) { S.flags.chart = true; S.step++; caption("The chart shows the beacon pulled the drowned crew in. A hatch above unlocks"); tone(330, .4, "triangle", .15); return o; }
  if (o === "lens" && near("lens")) { S.lens.active = true; return "lens-start"; }
  if (o === "beacon" && near("beacon")) { S.flags.beacon = true; S.step++; S.keeper = { ...S.keeper, x: 21.5, y: 6.5, mode: "chase", zone: "roof", on: true }; caption(`Beacon turns offshore · you send ${S.callsign || "a guess"}`); caption("The keeper breaches the roof"); tone(110, 1.2, "sawtooth", .25); return o; }
  if (o === "boat" && near("boat")) { S.step++; S.ended = true; caption("The boat's radio answers in a living voice"); return o; }
  return null;
}
function lensPress() {
  const inArc = Math.abs(((S.lens.a % 360) + 360) % 360 - 90) < 18;
  if (inArc) { S.lens.hits++; tone(880, .12, "triangle", .15); caption(`Shutter clicks (${S.lens.hits}/3)`); if (S.lens.hits >= 3) { S.lens.active = false; S.flags.lens = true; S.step++; caption("Roof hatch unlocks"); } }
  else { tone(90, .3, "square", .3); noise(S.px, S.py, 14, "Metal CLANG"); }
  return inArc;
}
function respawn() {
  S.caught++; [S.px, S.py] = S.checkpoint; S.lantern = false; S.hold = 0; S.lens.active = false; S.lens.hits = 0;
  const z = S.step <= 1 ? "intake" : S.step <= 2 ? "gallery" : S.step <= 4 ? "lens" : "roof";
  const p = PATROL[z][0]; S.keeper = { ...S.keeper, x: p[0] + .5, y: p[1] + .5, mode: S.step >= 5 ? "chase" : "patrol", wp: 0, zone: z, lost: 0 };
  if (S.step >= 5) { S.keeper.x = 21.5; S.keeper.y = 6.5; }
  caption("The tide takes you… you wake at the last safe room");
}
function update(dt, input) {
  if (S.ended || S.fade > 0) { S.fade = Math.max(0, S.fade - dt); if (S.fade === 0 && S.pendingRespawn) { S.pendingRespawn = false; respawn(); } return; }
  S.t += dt; S.beam += dt;
  const run = S.toggleRun ? S.running : !!input.run;
  let mx = (input.right ? 1 : 0) - (input.left ? 1 : 0), my = (input.down ? 1 : 0) - (input.up ? 1 : 0);
  const moving = (mx || my) && !S.lens.active && S.hold === 0;
  S.moving = !!moving;
  if (moving) {
    const len = Math.hypot(mx, my); mx /= len; my /= len; S.face = Math.atan2(my, mx);
    const wet = isWater(S.px, S.py), sp = (run ? 4.4 : 2.6) * (wet ? 0.6 : 1);
    const nx = S.px + mx * sp * dt, ny = S.py + my * sp * dt;
    if (walkable(nx, S.py)) S.px = nx; if (walkable(S.px, ny)) S.py = ny;
    S.stepT = (S.stepT || 0) - dt;
    if (S.stepT <= 0) { S.stepT = run ? 0.28 : 0.45;
      if (run) { tone(70, .08, "sine", .12, true); noise(S.px, S.py, wet ? 9 : 7, wet ? "Your splashing run" : "Your running steps"); }

  if (S.step >= 3 || UI.screen === "title") { const bx = SPOTS.lens[0] * TS + TS / 2 - cx, by = SPOTS.lens[1] * TS + TS / 2 - cy, a = S.beam * 1.2 + (UI.screen === "title" ? t * .9 : 0), al = reduce ? .35 : .55 + .35 * Math.max(0, Math.sin(S.beam * 6));
    const gr = L.createRadialGradient(bx, by, 10, bx, by, 900); gr.addColorStop(0, `rgba(0,0,0,${al})`); gr.addColorStop(1, "rgba(0,0,0,0)"); L.fillStyle = gr; L.beginPath(); L.moveTo(bx, by); L.arc(bx, by, 900, a, a + .25); L.closePath(); L.fill(); }
  L.globalCompositeOperation = "source-over";
  g.drawImage(LIGHT, 0, 0, STW, STH);
  if (S.lantern && UI.screen !== "title") { const gr = g.createRadialGradient(sx, sy, 0, sx, sy, 6 * TS); gr.addColorStop(0, "rgba(255,220,150,.12)"); gr.addColorStop(1, "rgba(255,220,150,0)"); g.fillStyle = gr; g.fillRect(0, 0, STW, STH); }
  // fair telegraph: the keeper's eyes show through the dark when it hunts
  if (k.on && UI.screen !== "title") { const ex = k.x * TS - cx, ey = k.y * TS - cy, dk = Math.hypot(ex - sx, ey - sy); if (k.mode === "chase" || dk < (S.lantern ? 6 : 2.4) * TS) eyes(ex, ey, k); }
  const dk = Math.hypot(k.x - S.px, k.y - S.py);
  if (dk < 4 && UI.screen === "play") { const p = (1 - dk / 4) * (reduce ? .5 : .75 + .25 * Math.sin(clock * 9)); const v = g.createRadialGradient(640, 360, 200, 640, 360, 760); v.addColorStop(0, "rgba(120,0,0,0)"); v.addColorStop(1, `rgba(120,0,0,${.55 * p})`); g.fillStyle = v; g.fillRect(0, 0, STW, STH); }
  if (S.surge > 0 && !reduce) { g.fillStyle = `rgba(80,140,180,${.06 * Math.sin(S.surge * 3) ** 2})`; g.fillRect(0, 0, STW, STH); }
  // pump hold ring and the lens dial
  if (S.hold > 0) { g.strokeStyle = "rgba(255,255,255,.15)"; g.lineWidth = 6; g.beginPath(); g.arc(sx, sy - 6, 30, 0, Math.PI * 2); g.stroke(); g.strokeStyle = "#ffe8a3"; g.beginPath(); g.arc(sx, sy - 6, 30, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * S.hold / 3); g.stroke(); }
  if (S.lens.active) {
    g.fillStyle = "rgba(0,0,0,.65)"; g.fillRect(0, 0, STW, STH); const ccx = 640, ccy = 340;
    g.fillStyle = "#14181d"; g.beginPath(); g.arc(ccx, ccy, 150, 0, Math.PI * 2); g.fill(); g.strokeStyle = "#8a6a2a"; g.lineWidth = 8; g.stroke();
    g.strokeStyle = "#2a3139"; g.lineWidth = 22; g.beginPath(); g.arc(ccx, ccy, 110, 0, Math.PI * 2); g.stroke();
    g.strokeStyle = "#e8c46a"; g.shadowColor = "#e8c46a"; g.shadowBlur = 12; g.beginPath(); g.arc(ccx, ccy, 110, (90 - 18) * Math.PI / 180, (90 + 18) * Math.PI / 180); g.stroke(); g.shadowBlur = 0;
    const a = S.lens.a * Math.PI / 180; g.strokeStyle = "#ffe8a3"; g.lineWidth = 5; g.lineCap = "round"; g.beginPath(); g.moveTo(ccx, ccy); g.lineTo(ccx + Math.cos(a) * 128, ccy + Math.sin(a) * 128); g.stroke();
    g.fillStyle = "#8a6a2a"; g.beginPath(); g.arc(ccx, ccy, 12, 0, Math.PI * 2); g.fill();
    for (let i = 0; i < 3; i++) { g.fillStyle = i < S.lens.hits ? "#e8c46a" : "#2a3139"; g.beginPath(); g.arc(ccx - 30 + i * 30, ccy + 190, 9, 0, Math.PI * 2); g.fill(); }
    g.fillStyle = "#e7eef5"; g.font = "600 26px 'Cormorant Garamond'"; g.textAlign = "center"; g.fillText("Press E as the needle crosses the gold arc", ccx, ccy - 180);
  }
  if (S.fade > 0) { g.fillStyle = `rgba(4,18,30,${Math.min(1, 1.3 - S.fade)})`; g.fillRect(0, 0, STW, STH); if (S.fade < .9) { g.fillStyle = `rgba(200,220,235,${Math.min(1, (1 - S.fade) * 1.4)})`; g.font = "italic 600 34px 'Cormorant Garamond'"; g.textAlign = "center"; g.fillText("The tide takes you…", 640, 360); } }
  if (S.ended) { g.fillStyle = "rgba(240,235,220,.08)"; g.fillRect(0, 0, STW, STH); }
}

// ---- HUD ------------------------------------------------------------------------------------------------------
const DIR = { right: "→", left: "←", above: "↑", below: "↓", close: "●" };
function hud() {
  const play = UI.screen === "play";
  for (const id of ["obj", "lamp", "mini", "tools", "caps"]) $(id).style.visibility = play ? "" : "hidden";
  if (!play) { $("prompt").style.display = "none"; return; }
  $("objT").textContent = STEPS[S.step].text;
  const r = roomAt(Math.floor(S.px), Math.floor(S.py));
  setHTML($("where"), r ? `${ROOMS[r].name}${ROOMS[r].checkpoint ? " · <b>safe room</b>: checkpoint, lantern recharges" : ""}` : "");
  const ob = SPOTS[objective()]; if (ob) $("arrow").style.transform = `rotate(${Math.atan2(ob[1] + .5 - S.py, ob[0] + .5 - S.px) * 180 / Math.PI + 90}deg)`;
  $("bat").style.width = `${S.battery}%`; $("lamp").classList.toggle("off", !S.lantern);
  $("lampTxt").textContent = `${S.lantern ? "Lantern on · you're seen from further" : "Lantern off · F to light"}${S.toggleRun && S.running ? " · running" : ""}`;
  setHTML($("caps"), $("optCaptions").checked ? S.captions.filter((c) => S.t - c.t < 3.5).map((c) => { const m = c.text.match(/— (\w+)\]$/), d = m ? DIR[m[1]] : "♪", danger = /keeper|RUN|heartbeat|CLANG/i.test(c.text);
    return `<div class="${danger ? "danger" : ""}"><i>${d}</i>${c.text.replace(/^\[|\]$/g, "").replace(/ — \w+$/, "")}</div>`; }).join("") : "");
  // interaction prompt over the nearest relevant object
  const pr = $("prompt"), near = (id) => { const [x, y] = SPOTS[id]; return Math.hypot(S.px - x - .5, S.py - y - .5) < 1.6; };
  let txt = null, at = null;
  if (near("callsign") && !S.callsign) { txt = "Read the scrawl"; at = SPOTS.callsign; }
  else if (ob && near(objective()) && !S.lens.active) { txt = { model: "Study the pump model", pump: "Hold to reroute the pump (loud)", chart: "Read the chart", lens: "Work the lens shutter", beacon: "Turn the beacon and send the call sign", boat: "Board the boat" }[objective()]; at = ob; }
  if (txt) { pr.innerHTML = `<kbd>E</kbd>${txt}`; pr.style.display = "block"; pr.style.left = `${at[0] * TS + TS / 2 - UI.cam.x}px`; pr.style.top = `${at[1] * TS - 4 - UI.cam.y}px`; } else pr.style.display = "none";
  minimap();
}
function minimap() {
  const c = $("mini"), x = c.getContext("2d"), s = 10; x.clearRect(0, 0, 416, 284); x.save(); x.translate(8, 8);
  for (const [k, r] of Object.entries(ROOMS)) { if (!S.seen[k]) continue; x.fillStyle = ROOMS[k].checkpoint ? "rgba(159,224,181,.35)" : "rgba(160,180,200,.28)"; x.fillRect(r.x * s, r.y * s, r.w * s, r.h * s); x.strokeStyle = "rgba(160,180,200,.5)"; x.lineWidth = 2; x.strokeRect(r.x * s, r.y * s, r.w * s, r.h * s); }
  for (const d of DOORS) { if (!S.seen[d.a] && !S.seen[d.b]) continue; x.fillStyle = d.lock && !S.flags[d.lock] ? "#a0503a" : "#9fb0c0"; x.fillRect(d.x * s + 2, d.y * s + 2, s - 4, s - 4); }
  const ob = SPOTS[objective()]; if (ob && S.seen[ob[2]]) { x.strokeStyle = "#e8c46a"; x.lineWidth = 3; x.beginPath(); x.arc(ob[0] * s + 5, ob[1] * s + 5, 9 + Math.sin(clock * 4) * 2, 0, Math.PI * 2); x.stroke(); }
  x.fillStyle = "#e7eef5"; x.beginPath(); x.arc(S.px * s, S.py * s, 6, 0, Math.PI * 2); x.fill();
  if (S.keeper.mode === "chase" && S.keeper.on) { x.fillStyle = "#ff5a5a"; x.beginPath(); x.arc(S.keeper.x * s, S.keeper.y * s, 5, 0, Math.PI * 2); x.fill(); }
  x.restore();
}

// ---- screens ------------------------------------------------------------------------------------------------------
function showScreen(html) { const s = $("screen"); s.innerHTML = html; s.classList.add("show"); }
function hideScreen() { $("screen").classList.remove("show"); $("screen").innerHTML = ""; }
function titleScreen() {
  UI.screen = "title"; S = fresh(); S.keeper.on = false;
  showScreen(`<div class="title-wrap"><div class="kicker">A short horror chapter</div><h1>Low <i>Tide</i></h1>
    <p>Restore the pump, work the great lens, signal the rescue boat — and get out before the keeper drags you under. It hunts by sound.</p>
    <div class="row"><button class="btn" id="go">Begin · about 6–8 min</button><button class="btn alt" id="opts">Accessibility</button></div>
    <div class="keys"><span><b>WASD</b>move</span><span><b>Shift</b>run (loud)</span><span><b>F</b>lantern</span><span><b>E</b>interact</span><span><b>Esc</b>settings</span><span><b>M</b>pause</span></div>
    <div class="warn">Contains darkness, a pursuing creature, heartbeat sounds and a flashing lighthouse beam (reduce it in Accessibility). Captions describe every sound and where it comes from.</div></div>
    <div class="foot">Original game · designed with <a href="https://github.com/bunhine0452/ai-game-designer">ai-game-designer</a> (<a href="../../showcase/04-codex-en-horror-lighthouse/">showcase session 04</a>) · rooms follow the revised beat list · <a href="../">← Arcade</a></div>`);
  $("go").onclick = start; $("opts").onclick = () => $("modal").classList.add("show");
}
function start() {
  audioInit(); hideScreen(); S = fresh(); S.toggleRun = $("optToggleRun").checked; UI.screen = "play"; UI.endShown = false; UI.t0 = performance.now();
  caption("A disconnected radio repeats your arrival words before you speak");
}
function endScreen() {
  UI.screen = "end"; const mins = ((performance.now() - UI.t0) / 60000).toFixed(1);
  showScreen(`<div class="card"><div class="kicker">Chapter complete</div><h2>The boat clears the tower.</h2>
    <p class="muted">${S.callsign ? "The radio answers your call sign, MARLOW-7, in a living voice." : "You sent a guess. Someone answers anyway."} Behind you, the light keeps turning.</p>
    <div class="stats"><div class="stat"><b>${mins} min</b><span>Time</span></div><div class="stat"><b>${S.caught}</b><span>Times caught</span></div><div class="stat"><b>${S.callsign ? "Found" : "Missed"}</b><span>Call sign</span></div></div>
    <div class="row"><button class="btn" id="again">Play again</button><a class="btn alt" href="../">Back to the arcade</a></div></div>`);
  $("again").onclick = () => { hideScreen(); start(); };
}

// ---- input -------------------------------------------------------------------------------------------------------
addEventListener("keydown", (e) => {
  const k = e.key.toLowerCase(); keys[k] = true;
  if (["arrowup", "arrowdown", "arrowleft", "arrowright", " "].includes(k)) e.preventDefault();
  if (k === "escape") { $("modal").classList.toggle("show"); return; }
  if (UI.screen !== "play") return;
  if (k === "m") UI.paused = !UI.paused;
  if (k === "f") { if (S.battery > 0) { S.lantern = !S.lantern; tone(1200, .04, "square", .05); } }
  if (k === "e" && !e.repeat) { if (S.lens.active) lensPress(); else tryInteract(); }
  if (k === "shift" && S.toggleRun) S.running = !S.running;
});
addEventListener("keyup", (e) => { keys[e.key.toLowerCase()] = false; });
const input = () => ({ up: keys.w || keys.arrowup, down: keys.s || keys.arrowdown, left: keys.a || keys.arrowleft, right: keys.d || keys.arrowright, run: keys.shift, interactHeld: keys.e });
$("optToggleRun").onchange = (e) => { S.toggleRun = e.target.checked; S.running = false; };
$("optVol").oninput = (e) => { volume = +e.target.value; if (master) master.gain.value = volume; };
$("setOk").onclick = () => $("modal").classList.remove("show");
$("bSet").onclick = () => $("modal").classList.add("show");
$("bHelp").onclick = () => { UI.paused = true; showScreen(`<div class="card"><div class="kicker">How to play</div><h2>Stay quiet. Follow the light.</h2>
  <div class="keys" style="margin-top:20px"><span><b>WASD</b>move</span><span><b>Shift</b>run (loud)</span><span><b>F</b>lantern</span><span><b>E</b>interact</span><span><b>Esc</b>settings</span><span><b>M</b>pause</span></div>
  <p class="muted" style="text-align:left">The keeper hears running, splashing and the pump. A lit lantern lets it see you from further away. Safe rooms (green on the map) are checkpoints and recharge your lantern. Being caught sends you back to the last safe room — never further.</p>
  <div class="row"><button class="btn" id="hOk">Back to it</button></div></div>`); $("hOk").onclick = () => { hideScreen(); UI.paused = false; }; };
$("rotX").onclick = () => { UI.rotX = true; $("rotate").classList.remove("show"); };
if (matchMedia("(pointer: coarse)").matches) {
  $("touch").classList.add("on");
  const bind = (id, key) => { const el = $(id); el.addEventListener("touchstart", (e) => { e.preventDefault(); keys[key] = true; if (key === "e") { if (S.lens.active) lensPress(); else tryInteract(); } if (key === "f" && S.battery > 0) S.lantern = !S.lantern; }); el.addEventListener("touchend", (e) => { e.preventDefault(); keys[key] = false; }); };
  bind("tU", "w"); bind("tD", "s"); bind("tL", "a"); bind("tR", "d"); bind("tE", "e"); bind("tF", "f"); bind("tRun", "shift");
}
addEventListener("resize", fit);

// =====================================================================================
// SELF-TEST (?test=1) and screenshot states (?shot=1, ?shot=title|lens|chase)
// =====================================================================================
function bfs(sx, sy, tx, ty) {
  const key = (x, y) => y * W + x, prev = new Map([[key(sx, sy), null]]), q = [[sx, sy]];
  while (q.length) { const [x, y] = q.shift(); if (x === tx && y === ty) break;
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) { const nx = x + dx, ny = y + dy; if (nx < 0 || ny < 0 || nx >= W || ny >= H || prev.has(key(nx, ny)) || !walkable(nx + .5, ny + .5)) continue; prev.set(key(nx, ny), [x, y]); q.push([nx, ny]); } }
  if (!prev.has(key(tx, ty))) return null;
  const path = []; let c = [tx, ty]; while (c) { path.unshift(c); c = prev.get(key(c[0], c[1])); } return path;
}
function walkTo(tx, ty) {      // bot: follow BFS path with the real movement code
  const path = bfs(Math.floor(S.px), Math.floor(S.py), tx, ty); if (!path) return false;
  for (const [x, y] of path) { let guard = 0;
    while (Math.hypot(S.px - x - .5, S.py - y - .5) > .25 && guard++ < 200) {
      const inp = { right: S.px < x + .4, left: S.px > x + .6, down: S.py < y + .4, up: S.py > y + .6 }; update(1 / 30, inp); if (S.fade > 0 || S.pendingRespawn) return false; } }
  return true;
}
function selftest() {
  const out = [], ok = (name, cond, info = "") => out.push({ name, pass: !!cond, info });
  S = fresh(); ok("gallery door starts locked", !walkable(16.5, 14.5));
  ok("no path to the roof before the story unlocks it", bfs(3, 20, SPOTS.beacon[0], SPOTS.beacon[1]) === null);
  S = fresh(); S.keeper.x = 18.5; S.keeper.y = 19.5; ok("running near the keeper draws it", noise(14.5, 19.5, 7, "test") && S.keeper.mode === "investigate");
  S = fresh(); ok("quiet sounds far away go unheard", !noise(3.5, 20.5, 4, null) && S.keeper.mode === "patrol");
  S = fresh(); caption("Wet footsteps", S.px + 5, S.py); ok("captions include direction", S.captions.some((c) => /right\]$/.test(c.text)), S.captions.map((c) => c.text).join("|"));
  S = fresh(); S.step = 2; S.checkpoint = [27.5, 21.5]; S.keeper.x = S.px; S.keeper.y = S.py; keeperUpdate(0.01); for (let i = 0; i < 60; i++) update(1 / 30, {});
  ok("being caught returns you to the last safe room", S.caught === 1 && Math.abs(S.px - 27.5) < .01);
  rng = seeded(4); S = fresh(); S.keeper.on = false; const trace = [];
  const go = (id) => { const [x, y] = SPOTS[id]; const r = walkTo(x, y); trace.push(`${id}:${r ? "ok" : "blocked"}`); return r; };
  go("model"); tryInteract(); go("pump"); for (let i = 0; i < 100; i++) update(1 / 30, { interactHeld: true });
  go("callsign"); tryInteract(); go("chart"); tryInteract(); go("lens"); tryInteract();
  for (let i = 0; i < 2000 && S.lens.active; i++) { update(1 / 60, {}); const a = ((S.lens.a % 360) + 360) % 360; if (Math.abs(a - 90) < 8) lensPress(); }
  go("beacon"); tryInteract(); S.keeper.on = false; go("boat"); tryInteract();
  ok("bot can finish the chapter (all doors unlock in order)", S.ended && S.step === STEPS.length - 1, trace.join(" "));
  ok("call sign from the alcove is used at the beacon", S.callsign === "MARLOW-7");
  ok("reduce-flashing option present", !!$("optFlash"));
  ok("every room the bot crossed is on the minimap", Object.keys(ROOMS).every((k) => S.seen[k] || k === "winch"), Object.keys(S.seen).join(","));
  try { UI.screen = "play"; render(0.016); hud(); ok("lit scene and HUD render", $("objT").textContent.length > 0); } catch (e) { ok("lit scene and HUD render", false, String(e).slice(0, 200)); }
  const pass = out.every((o) => o.pass);
  $("selftest").textContent = JSON.stringify({ game: "low-tide", pass, results: out }, null, 1);
  $("selftest").hidden = false; document.title = `SELFTEST ${pass ? "PASS" : "FAIL"}`;
  S = fresh(); rng = Math.random; UI.screen = "title";
}
function setupShot(kind) {
  document.body.classList.add("shot");
  if (kind === "title") return titleScreen();
  hideScreen(); UI.screen = "play"; UI.paused = true; S = fresh(); S.step = 3; S.flags = { model: true, pump: true, chart: true }; S.intakeDrained = true; S.callsign = "MARLOW-7";
  Object.assign(S.seen, { gate: true, intake: true, alcove: true, gallery: true, chart: true, lens: true });
  S.px = 28.5; S.py = 4.6; S.face = Math.PI; S.lantern = true; S.battery = 64; S.keeper = { ...S.keeper, x: 34.2, y: 3.6, mode: "patrol", zone: "lens", face: Math.PI }; S.t = 20; S.beam = 2.2;
  caption("Wet footsteps", 34.5, 3.5); caption("Surge rumbles", 16, 23);
  if (kind === "lens") { S.px = 31.5; S.py = 5.4; S.lens.active = true; S.lens.a = 60; S.lens.hits = 1; }
  if (kind === "chase") { S.keeper.mode = "chase"; S.keeper.x = 30.6; S.keeper.y = 3.4; S.lantern = false; caption("The keeper sees you — RUN", 30.6, 3.4); }
  UI.cam.x = Math.max(0, Math.min(W * TS - STW, S.px * TS - STW / 2)); UI.cam.y = Math.max(0, Math.min(H * TS - STH, S.py * TS - STH / 2 + 40));
}
const params = new URLSearchParams(location.search);
fit();
if (params.has("test")) selftest();
if (params.get("shot")) setupShot(params.get("shot")); else titleScreen();
requestAnimationFrame(frame);
</script>
