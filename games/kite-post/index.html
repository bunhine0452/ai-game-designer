  #rotate { position:fixed; left:12px; right:12px; top:12px; z-index:30; padding:12px 14px; border-radius:12px; background:var(--paper); font:400 14px var(--sans); display:none; } #rotate.show { display:block; }
  #rotate button { float:right; background:none; border:0; font-size:18px; cursor:pointer; }
  .shot #toast div, .shot #result.show, .shot #screen.show { animation:none; }
</style>

<script type="module">
import * as THREE from "three";
import { mergeGeometries } from "three/addons/utils/BufferGeometryUtils.js";
// ==SIM== (pure logic: no DOM, no WebGL; the self-test, the bot and node tests use only this part)
// Numbers from the design session (showcase 07): 02_art_direction.md §3 and data/deliveries_v2.csv.
const PHY = { CRUISE: 14, STALL: 8, VMAX: 24, DRAG: 0.35, A_DIVE: 3.5, A_CLIMB: 3.0, TURN: 1.22, G: 9.8,
  LAUNCH_UP: 40, LAUNCH_VY: 10, RESPAWN: 3, SEA: 2 };
// Updraft strengths: weak / mid / strong = 4 / 6 / 9 m/s, diameters 24 / 20 / 16 m.
const UPS = { 1: { s: 4, r: 12 }, 2: { s: 6, r: 10 }, 3: { s: 9, r: 8 } };
const ISLANDS = [
  { id: "H", kind: "hub", x: 0, z: 0, top: 60, r: 26 },
  { id: "L", kind: "lighthouse", x: 300, z: -20, top: 62, r: 17 },
  { id: "B", kind: "bakery", x: 330, z: 340, top: 55, r: 18 },
  { id: "T", kind: "bell", x: -70, z: 210, top: 66, r: 16 },
  { id: "W", kind: "windmill", x: -520, z: -50, top: 58, r: 20 },
  { id: "F", kind: "waterfall", x: -160, z: 380, top: 70, r: 20 },
  { id: "C", kind: "observatory", x: 540, z: -535, top: 64, r: 16 },
  { id: "c2", kind: "islet", x: 572, z: -560, top: 61, r: 9 },   // the observatory's twin, joined by the plank bridge
  { id: "S", kind: "shelter", x: 0, z: -1100, top: 60, r: 15 },
  { id: "P", kind: "skypo", x: -300, z: -2050, top: 66, r: 28 },
  // the windmill archipelago: #4 passes three stepping islets
  { id: "i1", kind: "islet", x: -205, z: 158, top: 50, r: 9 },
  { id: "i2", kind: "islet", x: -322, z: 72, top: 53, r: 10 },
  { id: "i3", kind: "islet", x: -430, z: 8, top: 49, r: 8 },
  // scenery islets (landable: every landing refills the +40 m launch)
  { id: "s1", kind: "islet", x: 150, z: 160, top: 42, r: 9 },
  { id: "s2", kind: "islet", x: -150, z: -170, top: 52, r: 11 },
  { id: "s3", kind: "islet", x: 470, z: 180, top: 46, r: 9 },
  { id: "s4", kind: "islet", x: 110, z: 470, top: 40, r: 10 },
  { id: "s5", kind: "islet", x: -640, z: 230, top: 50, r: 12 },
  { id: "s6", kind: "islet", x: 760, z: -260, top: 54, r: 11 },
  { id: "s7", kind: "islet", x: -330, z: -480, top: 48, r: 12 },

  { id: "s9", kind: "islet", x: -420, z: -1300, top: 44, r: 12 },

ISLANDS.forEach((I) => (I.depth = I.r * 1.7));
const ISL = Object.fromEntries(ISLANDS.map((I) => [I.id, I]));
// Tall landmarks you can bump into: [x, z, radius, bottom, top]
const TOWERS = [[0, 0, 3.6, 60, 84], [300, -20, 2.6, 62, 92], [-520, -50, 4.2, 58, 80], [-70, 210, 3.2, 66, 86]];
const PAD = { x: 0, z: 0, top: 84.6, r: 3.6 };   // the post tower's roof: the opening dive starts here
// Updrafts: [x, z, top, strength(1..3), pulse?]. They rise out of the cloud sea and fade over the last 10 m.
const UPDRAFTS = [
  [125, 5, 104, 1], [185, -72, 104, 1],                                  // #1 tutorial: two weak, can't fail
  [252, 168, 102, 2], [398, 152, 102, 2],                                // #2 pick one of two
  [178, 296, 120, 2], [52, 236, 106, 1],                                 // #3 one good climb beats the bell
  [-188, 132, 100, 2], [-338, 50, 100, 2], [-445, -22, 98, 1, 1],        // #4 (the last one is cut by the windmill)
  [-410, 118, 106, 2], [-290, 258, 114, 3],                              // #5 no spare
  [140, -120, 102, 2], [292, -262, 104, 3], [428, -410, 106, 2], [232, -392, 100, 1],   // #6 first strong (gold)
  [432, -690, 104, 2], [272, -850, 106, 3], [112, -992, 102, 2],         // #7 between the lightning
  [-52, -1272, 104, 2], [-108, -1440, 108, 3], [-166, -1612, 106, 2], [-250, -1840, 108, 2], [-62, -1560, 100, 1],  // #8
].map(([x, z, top, k, pulse]) => ({ x, z, top, k, r: UPS[k].r, s: UPS[k].s, pulse: !!pulse }));

const LANE = { ax: -20, az: -1180, bx: -282, bz: -1990, r: 18, s: 6 };            // #8 tailwind lane
const HEADWIND = { z0: -960, z1: -760, w: 3.5 };                                    // #7 storm front headwind band

  Object.assign(G.P, { x: S.at[0], y: S.at[1], z: S.at[2], yaw, mode: "fly", v: 13, vy: 0, steer: 0, pd: 0 });
  pattern = S.pat; KITE.setPattern(S.pat); KITE.inited = false; mode = "play"; flags = {};
  const pal = palTarget(G); for (const key of Object.keys(PAL[pal])) { const v = PAL[pal][key]; if (PCUR[key] instanceof THREE.Color) PCUR[key].setHex(v); else PCUR[key] = v; }
  for (let i = 0; i < 75; i++) { for (let s = 0; s < 4; s++) gameStep(G, { steer: S.steer, pitch: -0.1 }, STEP); G.ev.length = 0; syncWorld(G, 1 / 30); camUpdate(G, 1 / 30, i === 0); }
  G.el = S.el;
}

// ---- main loop ----
applyText(); fit();
ATTRACT = newGame(); ABOT = {};
for (let i = 0; i < 120 * 14; i++) { gameStep(ATTRACT, botInput(ATTRACT, ABOT), STEP); ATTRACT.ev.length = 0; }   // the title opens mid-flight
if (TEST) selftest();
if (SHOT) {
  document.body.classList.add("shot"); setShot(+params.get("shot")); flags.allowToast = 1;
  toast(`${tr("tLetter")} · <b>${dtx(G.di, 0)}</b> → ${dtx(G.di, 2)}`, 60000); hud(G);
  (function still() { renderer.render(scene, camera); requestAnimationFrame(still); })();
} else {
  if (AUTO) startGame(); else titleScreen();   // ?autopilot=1 is a watch mode: the autopilot flies the real journey
  let acc = 0, last = performance.now(), lastAtt = -2;
  (function frame(now) {
    const dt = Math.max(0, Math.min(0.1, (now - last) / 1000)) * (mode === "play" ? SPEED : 1); last = now;   // rAF stamps can precede the script's clock
    const g = world();
    if (mode === "play" || mode === "title") {
      acc += dt;
      while (acc >= STEP) {
        if (mode === "title") { if (ATTRACT.di !== lastAtt) { ABOT.plan = null; lastAtt = ATTRACT.di; } gameStep(ATTRACT, botInput(ATTRACT, ABOT), STEP); if (ATTRACT.phase === "free") { ATTRACT = newGame(); ABOT = {}; } }
        else gameStep(G, readInput(), STEP);
        acc -= STEP;
      }
      handleEvents(g); if (mode === "play") tutorial(G, dt);
    }
    const pn = syncWorld(world(), dt); camUpdate(world(), dt, false); hud(world());
    if (AU.ctx) { const P = world().P; AU.wind.gain.value += ((P.mode === "fly" ? 0.05 + clamp((P.v - 8) / 16, 0, 1) * 0.16 : 0.02) - AU.wind.gain.value) * Math.min(1, dt * 3); AU.windF.frequency.value = 350 + P.v * 45; musicTick(pn, P.mode === "fly" ? 1 : 0.5);
      if (P.air && P.air.upF > 0.4 && P.mode === "fly" && mode === "play" && (flags.chime = (flags.chime || 0) - dt) < 0) { flags.chime = 0.7; SFX.up((flags.ck = (flags.ck || 0) + 1)); } }
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  })(last);
}
</script>
