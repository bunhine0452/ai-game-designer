  .how { display:grid; grid-template-columns:1fr 1fr; gap:12px; text-align:left; margin-top:14px; } .how div { padding:13px 15px; border-radius:16px; background:rgba(255,255,255,.05); border:1px solid var(--line); color:var(--ink2); font:600 14px/1.5 var(--font); } .how b { display:block; color:var(--ink); font:800 16px var(--font); margin-bottom:2px; }

  .title-wrap .en { font:800 24px var(--font); letter-spacing:.18em; color:#ffe9a8; margin-top:6px; }
  .title-wrap p { font:700 18px/1.55 var(--font); color:var(--ink2); margin:18px 0 26px; }
  .title-wrap .row { display:flex; gap:12px; justify-content:flex-end; }
  .foot { position:absolute; left:0; right:0; bottom:18px; text-align:center; font:600 12.5px var(--font); color:var(--ink3); } .foot a { color:var(--ink2); }
  #tip { position:absolute; z-index:10; max-width:260px; padding:9px 12px; border-radius:12px; background:rgba(16,12,48,.97); border:1px solid var(--line); font:600 13px/1.45 var(--font); pointer-events:none; display:none; } #tip.show { display:block; }
  #rotate { position:fixed; left:12px; right:12px; top:12px; z-index:20; padding:12px 14px; border-radius:12px; background:#1e1650; font:700 14px var(--font); display:none; } #rotate.show { display:block; } #rotate button { float:right; background:none; border:0; color:var(--ink2); font-size:18px; cursor:pointer; }
  .shot #results.show, .shot #screen.show, .shot #modal.show, .shot #heroArt { animation:none; } .shot .rc { transition:none; }
</style>

<script>
"use strict";
// =====================================================================================
// RULES. Banner from the design (showcase/03 config/hoshiyobi_economy_v2.json + review).
// =====================================================================================
const RATE = { SSR: 0.03, SR: 0.12 }, PICKUP_SHARE = 0.5, SPARK = 120, COST = 150;
const PICKUP = { id: "kirin", name: "Aurora Kirin", jp: "オーロラ麒麟", hue: 170 };
const POOL = {
  SSR: [{ id: "whale", name: "Tide Whale", jp: "潮鯨", hue: 205 }, { id: "fox", name: "Ember Fox", jp: "熾火狐", hue: 18 },
        { id: "owl", name: "Moon Owl", jp: "月梟", hue: 255 }, { id: "golem", name: "Thorn Golem", jp: "茨巨人", hue: 110 }],
  SR: [{ id: "sprout", name: "Sproutling", jp: "芽ぐみ", hue: 95 }, { id: "puff", name: "Puffcap", jp: "ふわ茸", hue: 330 }, { id: "ray", name: "Glow Ray", jp: "灯エイ", hue: 190 },
       { id: "bat", name: "Dusk Bat", jp: "宵コウモリ", hue: 280 }, { id: "crab", name: "Coral Crab", jp: "珊瑚ガニ", hue: 8 }, { id: "moth", name: "Lantern Moth", jp: "灯蛾", hue: 48 }],
  R: [{ id: "slime", name: "Star Slime", jp: "星スライム", hue: 210 }, { id: "pebble", name: "Pebble", jp: "小石っこ", hue: 30 }, { id: "drop", name: "Dewdrop", jp: "露しずく", hue: 185 },
      { id: "mote", name: "Mote", jp: "綿ぼこり", hue: 60 }, { id: "frog", name: "Bog Frog", jp: "沼ガエル", hue: 120 }],
};
let rng = Math.random;
function seeded(a) { return () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const fresh = () => ({ stars: 3000, spark: 0, guaranteed: false, pulls: 0, owned: {}, history: [] });
let S = fresh();
// One summon: returns {r, unit, how}. Spark points accrue per summon and carry over.
function summon() {
  S.pulls++; S.spark = Math.min(SPARK, S.spark + 1);
  const x = rng();
  if (x < RATE.SSR) {
    let unit;
    if (S.guaranteed || rng() < PICKUP_SHARE) { unit = PICKUP; S.guaranteed = false; }
    else { unit = POOL.SSR[Math.floor(rng() * POOL.SSR.length)]; S.guaranteed = true; }
    return grant("SSR", unit, unit === PICKUP ? "pickup" : "lost");
  }
  if (x < RATE.SSR + RATE.SR) return grant("SR", POOL.SR[Math.floor(rng() * POOL.SR.length)], "");
  return grant("R", POOL.R[Math.floor(rng() * POOL.R.length)], "");
}
function grant(r, unit, how) {
  const isNew = !S.owned[unit.id]; S.owned[unit.id] = (S.owned[unit.id] || 0) + 1;
  const res = { r, unit, how, n: S.pulls, isNew }; S.history.push(res); if (S.history.length > 200) S.history.shift();
  return res;
}
function exchange() { if (S.spark < SPARK) return false; S.spark = 0; grant("SSR", PICKUP, "exchange"); return true; }
function pull(n) { if (S.stars < COST * n) return []; S.stars -= COST * n; const out = []; for (let i = 0; i < n; i++) out.push(summon()); return out; }
// Exact odds from any state: P(pickup obtained by summon k), k = 1..max.
function pickupCdf(state, maxK = SPARK) {
  let notYet = [state.guaranteed ? 0 : 1, state.guaranteed ? 1 : 0];   // [not guaranteed, guaranteed]
  const cdf = []; let got = 0;
  for (let k = 1; k <= maxK; k++) {
    if (state.spark + k >= SPARK) { got += notYet[0] + notYet[1]; notYet = [0, 0]; cdf.push(got); continue; }  // can exchange
    const p = RATE.SSR, g0 = notYet[0], g1 = notYet[1];
    got += g1 * p + g0 * p * PICKUP_SHARE;
    notYet = [g0 * (1 - p), g1 * (1 - p) + g0 * p * (1 - PICKUP_SHARE)];
    cdf.push(got);
    if (notYet[0] + notYet[1] < 1e-12) break;
  }
  return cdf;
}
const meanFromCdf = (cdf) => cdf.reduce((s, c, i) => s + (c - (i ? cdf[i - 1] : 0)) * (i + 1), 0);

// =====================================================================================
// PRESENTATION
// =====================================================================================
const $ = (id) => document.getElementById(id);
const setHTML = (el, html) => { if (el._html !== html) { el._html = html; el.innerHTML = html; } };
const STW = 1280, STH = 720, ALTAR = { x: 664, y: 566 };
const rnd = (a, b) => a + Math.random() * (b - a);
const KEY = "hoshiyobi-island";
const SET = (() => { const d = { sound: true, lang: (navigator.language || "").startsWith("ja") ? "ja" : "en" }; try { return { ...d, ...JSON.parse(localStorage.getItem(KEY) || "{}") }; } catch (e) { return d; } })();
function saveSet() { try { localStorage.setItem(KEY, JSON.stringify(SET)); } catch (e) { /* optional */ } }
const UI = { screen: "title", falling: [], parts: [], lanterns: [], flash: 0, busy: false, reveal: null };

const STR = {
  en: { brand: "Hoshiyobi Island<small>星喚びの島 · STAR SUMMON</small>", odds: "Rates", book: "Collection", hist: "History", lang: "日本語",
    pickupTag: "★ PICKUP SSR", stars: "Your stars", starsN: "= {n} summons", p1: "Summon ×1<small>150 ★</small>", p10: "Summon ×10<small>1,500 ★</small>",
    g50: "Next SSR: 50/50 for the pickup", gOn: "Next SSR: the pickup, guaranteed", spark: "Exchange points", sparkLeft: "{n} to go · carries over",
    sparkReady: "ready to exchange", exch: "Exchange 120 points for Aurora Kirin", chance: "With your <b>{n}</b> summons: <b>{p}%</b> chance of Aurora Kirin. Guaranteed by summon <b>#{w}</b> at the latest.",
    chanceNone: "No summons left. Guaranteed by summon <b>#{w}</b> from now.", free: "+1,500 ★", freeTxt: "Free demo stars. Nothing here can be bought.",
    rateChip: "Pickup <b>1.50%</b>", rateChip2: "SSR <b>3%</b> · SR 12% · R 85%", results: "Results", sum: "{ssr} SSR · {sr} SR · {r} R", ok: "OK", again: "Summon ×10 again", skip: "Show all",

async function doSummon(n) {
  if (UI.busy) return; audioInit();
  const res = pull(n); if (!res.length) return;
  UI.busy = true; render(); sfx.summon(); UI.flash = 1;
  for (let i = 0; i < n; i++) UI.falling.push({ x0: rnd(700, 1250), y0: rnd(-40, 120), k: -i * 0.05, d: .7 });
  await wait(780);
  for (let i = 0; i < 40; i++) { const a = rnd(0, Math.PI * 2), v = rnd(40, 200); UI.parts.push({ x: ALTAR.x, y: ALTAR.y - 80, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 60, life: 0, max: rnd(.5, 1.1), r: rnd(1.5, 3), c: "#dffff9" }); }
  showResults(res, n);
}

  $("go").onclick = () => { audioInit(); sfx.ui(); s.classList.remove("show"); s.innerHTML = ""; UI.screen = "play"; for (const id of ["hero", "panel"]) $(id).style.visibility = ""; render(); };
  $("how").onclick = () => { audioInit(); howModal(); };
}

// ---- input -------------------------------------------------------------------------------------------------
$("p1").onclick = () => doSummon(1); $("p10").onclick = () => doSummon(10); $("exchange").onclick = doExchange;
$("free").onclick = () => { S.stars += 1500; sfx.coin(); render(); };
$("bOdds").onclick = oddsModal; $("bBook").onclick = bookModal; $("bHist").onclick = histModal; $("bHelp").onclick = howModal;
$("bLang").onclick = () => { SET.lang = SET.lang === "ja" ? "en" : "ja"; saveSet(); render(); if (UI.screen === "title") titleScreen(); };
$("bSound").onclick = () => { SET.sound = !SET.sound; saveSet(); audioInit(); if (AU.out) AU.out.gain.value = SET.sound ? 0.5 : 0; render(); };
$("rotX").onclick = () => { UI.rotX = true; $("rotate").classList.remove("show"); };
addEventListener("keydown", (ev) => { if ($("modal").classList.contains("show") && (ev.key === "Escape" || ev.key === "Enter")) closeModal(); else if ($("results").classList.contains("show") && (ev.key === "Enter" || ev.key === " ")) { ev.preventDefault(); const s = $("rSkip"); if ([...document.querySelectorAll(".rc:not(.flip)")].length) s.click(); else $("rOk").click(); } });
addEventListener("resize", fit);
$("heroArt").innerHTML = artSVG(PICKUP);

// =====================================================================================
// SELF-TEST (?test=1) and screenshot states (?shot=1, ?shot=title|odds|book|one)
// =====================================================================================
function selftest() {
  const out = [], ok = (name, cond, info = "") => out.push({ name, pass: !!cond, info });
  const exact = meanFromCdf(pickupCdf(fresh()));
  ok("exact mean = 47.1 summons (design doc)", Math.abs(exact - 47.1) < 0.1, exact.toFixed(2));
  ok("consolidated rate = 2.12%", Math.abs(100 / exact - 2.12) < 0.01, (100 / exact).toFixed(3));
  ok("worst case = 120 summons", pickupCdf(fresh()).length === 120 && pickupCdf(fresh())[119] > 1 - 1e-12);
  rng = seeded(7); let tot = 0, worst = 0; const N = 40000;
  for (let i = 0; i < N; i++) { S = fresh(); S.stars = 1e9; let n = 0;
    while (true) { n++; const r = pull(1)[0]; if (r.unit === PICKUP) break; if (S.spark >= SPARK) { exchange(); break; } }
    tot += n; worst = Math.max(worst, n); }
  ok("Monte Carlo mean matches exact (±2%)", Math.abs(tot / N - exact) / exact < 0.02, (tot / N).toFixed(2));
  ok("Monte Carlo worst case ≤ 120", worst <= 120, String(worst));
  S = fresh(); let seq = [0.001, 0.9]; rng = () => seq.shift() ?? 0.5; pull(1); ok("losing 50/50 sets guarantee", S.guaranteed === true);
  seq = [0.001, 0.9]; rng = () => seq.shift() ?? 0.5; const r = pull(1)[0]; ok("guaranteed SSR is the pickup", r.unit === PICKUP && !S.guaranteed);
  S = fresh(); S.spark = 119; rng = () => 0.99; pull(1); ok("spark reaches 120 and exchange works", S.spark === 120 && exchange() && S.spark === 0);
  S = fresh(); pull(10); ok("ten summons cost 1,500 stars", S.stars === 1500);
  const sum = RATE.SSR + RATE.SR + (1 - RATE.SSR - RATE.SR); ok("odds table sums to 100%", Math.abs(sum - 1) < 1e-12);
  ok("every creature has its own art", ALL.every((u) => typeof ART[u.id] === "function") && new Set(ALL.map((u) => ART[u.id])).size === ALL.length);
  const missing = Object.keys(STR.en).filter((k) => !(k in STR.ja)); ok("every English string has a Japanese translation", !missing.length, missing.join(", "));
  try { S = fresh(); render(); ok("panel renders the exact chance for the starting stars", /20/.test($("chanceTxt").textContent) && $("p10").textContent.length > 0, $("chanceTxt").textContent.slice(0, 80)); }
  catch (e) { ok("panel renders the exact chance for the starting stars", false, String(e).slice(0, 200)); }
  const pass = out.every((o) => o.pass);
  $("selftest").textContent = JSON.stringify({ game: "hoshiyobi-island", pass, results: out }, null, 1);
  $("selftest").hidden = false; document.title = `SELFTEST ${pass ? "PASS" : "FAIL"}`;
  S = fresh(); rng = Math.random;
}
function setupShot(kind) {
  document.body.classList.add("shot"); SET.sound = false;
  if (kind === "title") return titleScreen();
  UI.screen = "play"; rng = seeded(20261030); S = fresh(); S.stars = 6000; pull(10); pull(10); S.spark = 47; render();
  if (kind === "main") return;
  if (kind === "odds") return oddsModal();
  if (kind === "book") { for (const u of ALL.slice(0, 11)) S.owned[u.id] = S.owned[u.id] || 1; return bookModal(); }
  if (kind === "one") { S.spark = 120; doExchange(); setTimeout(() => document.querySelectorAll(".rc").forEach((el) => el.classList.add("flip")), 0); return; }
  const seq = [0.001, 0.9]; const keep = rng; rng = () => (seq.length ? seq.shift() : keep()); const last = pull(10); S.guaranteed = true; render();
  UI.busy = true; showResults(last, 10).then(() => {}); setTimeout(() => document.querySelectorAll(".rc").forEach((el) => el.classList.add("flip")), 0);
}
const params = new URLSearchParams(location.search);
fit();
if (params.has("test")) selftest();
if (params.get("shot")) setupShot(params.get("shot")); else titleScreen();
render(); requestAnimationFrame(frame);
</script>
